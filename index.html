<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hábitos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuaderno">
<meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101820" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="preload" href="ui/fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="ui/base.css">
<style>
/* Hábitos sobre la base compartida (ui/base.css). Solo lo propio de esta app. */
body.lock{overflow:hidden}
main{max-width:640px;margin:0 auto;padding:8px 16px 0}
.sub{margin:4px 0 16px;color:var(--mu);font-size:var(--t14);font-weight:700}.sub::first-letter{text-transform:uppercase}
.bloque,.dia-estado,.prot,.semana{position:relative;background:var(--card);border:2px solid var(--ln);border-bottom-width:4px;border-radius:var(--r-l);padding:16px 18px;margin:0 0 14px}
.bloque-h{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:8px}
.t12{font-size:var(--t12)}.t14{font-size:var(--t14)}
.vacio{padding:24px 0;color:var(--mu)}

/* estado del día: tarjeta naranja con fuego */
.dia-estado{overflow:hidden;color:#fff;background:linear-gradient(140deg,#FF9A3D 0%,#FF7A2F 55%,#F2611B 100%);border-color:#D9530F;padding:20px 18px 18px}
.dia-estado::before{content:"";position:absolute;width:200px;height:200px;right:-60px;top:-80px;border-radius:50%;background:rgba(255,255,255,.14)}
.dia-estado::after{content:"🔥";position:absolute;right:18px;top:14px;font-size:46px;line-height:1;animation:flota 3s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.dia-estado>*{position:relative;z-index:1}
.dia-estado .rotulo,.dia-estado .mu{color:rgba(255,255,255,.85)!important}
.dia-estado .cifra{display:block;font-size:48px;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.dia-estado p{margin:10px 0 0;color:rgba(255,255,255,.95);font-size:var(--t14);font-weight:800}
.dia-estado.completo{background:linear-gradient(140deg,#22C468 0%,#12A453 55%,#0E8F49 100%);border-color:#0C7F3F}
.dia-estado.completo::after{content:"🏆"}
.regla{position:relative;height:18px;background:rgba(0,0,0,.18);margin-top:14px;border-radius:999px}
.regla>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#fff;min-width:18px;transition:width 500ms var(--spring)}
.regla>i[style*="width:0%"]{min-width:0}
.regla>em{position:absolute;top:-4px;bottom:-4px;width:4px;border-radius:4px;background:#fff;opacity:.7}
@media (prefers-color-scheme:dark){.dia-estado{background:linear-gradient(140deg,#E3782A 0%,#CF5E1A 100%);border-color:#A84612}.dia-estado.completo{background:linear-gradient(140deg,#1C9E55 0%,#0E6535 100%);border-color:#0B5A2F}}

/* semana en curso */
.sem{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.sem div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:var(--t12);font-weight:800;color:var(--mu)}
.sem i{display:grid;place-items:center;width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;background:var(--track);font-style:normal}
.sem .met i{background:var(--naranja);box-shadow:0 3px 0 #D9530F}
.sem .met i::after{content:"🔥";font-size:16px}
.sem .hoy b{color:var(--sel)}
.sem .hoy i{box-shadow:inset 0 0 0 3px var(--sel)}
.sem .met.hoy i{box-shadow:0 3px 0 #D9530F,inset 0 0 0 3px var(--sel)}
.sem .libre i{background:none;border:2px dashed var(--ln2)}
.regla-sem{margin:12px 0 0;font-size:var(--t14);color:var(--mu)}
.regla-sem b{color:var(--tx);font-weight:900}
.regla-sem.ok b{color:var(--naranja)}

/* lista de hábitos de hoy: cada uno una card */
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 8px}
.lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;min-height:76px;padding:10px 10px 10px 12px;background:var(--card);border:2px solid var(--ln);border-bottom-width:4px;border-radius:20px;position:relative;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.emo-i{width:48px;height:48px;flex:none;display:grid;place-items:center;font-size:26px;border-radius:16px;background:color-mix(in srgb,var(--c,var(--sel)) 16%,var(--card))}
.txt{flex:1;min-width:0}
.nm{display:block;font-weight:900;font-size:var(--t16);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;color:var(--mu);font-size:var(--t14);font-weight:700;margin-top:2px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.item.done{background:var(--pos-bg);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.item.done .nm{color:var(--pos)}
.chk{width:54px;height:54px;flex:none;border-radius:16px;border:2px solid var(--ln2);border-bottom-width:5px;background:var(--card);color:#fff;display:grid;place-items:center;padding:0;transition:transform 110ms var(--ease),background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.chk:active{transform:translateY(3px);border-bottom-width:2px}
.chk svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.done .chk{background:var(--acc);border-color:var(--acc-sh)}
.done .chk svg{opacity:1}
.chk.anim{animation:rebote 460ms var(--spring)}
.chk.anim svg path{stroke-dasharray:24;animation:trazo 260ms var(--ease)}

/* pendientes del día (con dictado por voz) */
.pend-form{display:flex;gap:8px;margin-bottom:14px}
.pend-form .campo{flex:1;min-width:0}
.pend-form .campo:focus{border-color:var(--sel);outline:none}
.pend-b{width:50px;height:50px;flex:none;display:grid;place-items:center;padding:0;border-radius:14px;border:2px solid var(--ln2);border-bottom-width:4px;background:var(--card);color:var(--tx);transition:transform 110ms var(--ease)}
.pend-b:active{transform:translateY(2px);border-bottom-width:2px}
.pend-b.mas{background:var(--acc);border-color:var(--acc-sh);color:#fff}
.pend-voz-b{width:100%;min-height:64px;display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 10px;border-radius:20px;border:2px solid var(--acc-sh);border-bottom-width:5px;background:var(--acc);color:#fff;font:900 var(--t16)/1 var(--sans);transition:transform 110ms var(--ease)}
.pend-voz-b .ic{width:26px;height:26px}
.pend-voz-b:active{transform:translateY(3px);border-bottom-width:2px}
.pend-voz-b.on{background:var(--neg);border-color:var(--neg);animation:escucha 1.2s ease-in-out infinite}
.badge{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--neg);color:#fff;font:900 11px/18px var(--sans);text-align:center}
.rail .badge{position:static;margin-left:auto}
@keyframes escucha{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--neg) 45%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.pend-voz{margin:-2px 4px 12px;font-weight:700}
.pend-voz:empty{display:none}
.pend-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pend-it{display:flex;align-items:center;gap:10px;min-height:52px;border-top:2px solid var(--bg3);padding:4px 0}
.pend-it:first-child{border-top:0}
.pend-it .chk{width:40px;height:40px;border-radius:12px;border-bottom-width:4px}
.pend-it .chk svg{width:22px;height:22px}
.pend-tx{flex:1;min-width:0;font-weight:800;overflow-wrap:anywhere}
.pend-tx small{display:block;color:var(--naranja);font-size:var(--t12);font-weight:800}
.pend-it.done .pend-tx{color:var(--mu);text-decoration:line-through}

.pend-dest{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.pend-dest button{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border:2px solid var(--ln2);border-bottom-width:4px;border-radius:12px;background:var(--card);color:var(--mu);font:800 var(--t14)/1 var(--sans)}
.pend-dest button i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pend-dest button.on{background:var(--sel-bg);border-color:var(--sel);color:var(--sel)}
.pend-grid .bloque{margin:0 0 12px;break-inside:avoid}
@media (min-width:760px){.pend-grid{columns:2;column-gap:12px}}
.pcard{border-color:color-mix(in srgb,var(--c) 45%,var(--ln));border-top:8px solid var(--c);padding-top:10px}
.pcard-h{display:flex;align-items:center;gap:8px;margin:0 -6px 2px 0}
.pcard-h h2{flex:1;display:flex;align-items:center;gap:8px;margin:0}
.pcard-h h2 i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.pcard.vacia{opacity:.85}
.pcard-v{margin:2px 0 4px}
button.pend-tx{background:none;border:0;padding:6px 0;text-align:left;color:inherit;font:inherit;font-weight:800;cursor:pointer}

/* pendientes en compu: más ancho, vistas Cuentas / Semana / Mes */
main.ancho{max-width:1320px}
.pend-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pend-top .sub{margin-bottom:0}
.c-hoy{color:var(--naranja)} .c-venc{color:var(--neg)}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:16px;background:var(--bg3)}
.seg button{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-radius:12px;background:none;color:var(--mu);font:800 var(--t14)/1 var(--sans)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 2px 0 var(--ln2)}
.pend-carga{display:flex;gap:10px;align-items:stretch;margin-bottom:6px}
.pend-carga .pend-voz-b{width:auto;min-height:50px;margin:0;padding:0 18px;flex:none;font-size:var(--t14)}
.pend-carga .pend-form{flex:1;margin:0}
.pend-form .pend-fecha{flex:none;width:170px!important;padding:0 10px!important;color-scheme:light dark}
@media (max-width:700px){.pend-carga{flex-direction:column}.pend-fecha{width:140px!important}}
.pend-meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.pend-meta small{display:inline}
.vence{display:inline-flex;align-items:center;gap:4px;font-size:var(--t12);font-weight:800;color:var(--mu)}
.vence .ic{width:13px;height:13px}
.vence.hoy{color:var(--naranja)} .vence.venc{color:var(--neg)} .vence.pronto{color:var(--sel)}
.sobre{outline:3px dashed var(--sel);outline-offset:2px}
.arrastrando{opacity:.4}
[draggable="true"]{cursor:grab}
.cal-nav{display:flex;align-items:center;gap:6px;margin:6px 0 12px}
.cal-nav b{font-size:var(--t18,18px)}
.b-sec.chico{min-height:36px;padding:0 12px;font-size:var(--t14);margin-left:8px}
.cal-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.cal-atras,.cal-sin{background:var(--card);border:2px solid var(--ln);border-bottom-width:4px;border-radius:var(--r-l);padding:12px 14px;margin-bottom:12px}
.cal-atras{border-color:color-mix(in srgb,var(--neg) 45%,var(--ln))}
.cal-sin{margin-top:12px}
.tk-fila{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.sem-g{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto}
.sem-d{display:flex;flex-direction:column;min-height:300px;background:var(--card);border:2px solid var(--ln);border-bottom-width:4px;border-radius:18px;padding:8px}
.sem-d.hoy{border-color:var(--sel);background:color-mix(in srgb,var(--sel) 6%,var(--card))}
.sem-d.pasado{background:color-mix(in srgb,var(--bg3) 50%,var(--card))}
.sem-dh{display:flex;align-items:baseline;gap:6px;padding:2px 4px 8px;color:var(--mu);font-weight:800;font-size:var(--t14)}
.sem-dh b{font-size:var(--t20,20px);color:var(--tx)}
.sem-d.hoy .sem-dh b,.sem-d.hoy .sem-dh span{color:var(--sel)}
.sem-dh em{margin-left:auto;font-style:normal;font-size:var(--t12);background:var(--bg3);border-radius:8px;padding:2px 7px}
.sem-l{display:flex;flex-direction:column;gap:6px;flex:1}
.sem-add{margin-top:6px;min-height:34px;border:2px dashed var(--ln2);border-radius:12px;background:none;color:var(--mu);display:grid;place-items:center;opacity:.6}
.sem-d:hover .sem-add{opacity:1}
.tk{display:flex;align-items:flex-start;gap:6px;background:var(--bg2);border:1.5px solid var(--ln);border-left:5px solid var(--c);border-radius:10px;padding:6px 6px 6px 7px}
.tk.venc{background:color-mix(in srgb,var(--neg) 10%,var(--bg2))}
.tk-chk{flex:none;width:22px;height:22px;margin-top:1px;border-radius:7px;border:2px solid var(--ln2);background:var(--card);display:grid;place-items:center;padding:0;color:#fff}
.tk-chk svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tk.done .tk-chk{background:var(--acc);border-color:var(--acc-sh)} .tk.done .tk-chk svg{opacity:1}
.tk-tx{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;color:var(--tx);font:700 var(--t14)/1.3 var(--sans);overflow-wrap:anywhere;cursor:pointer}
.tk-tx small{display:block;font-size:11px;font-weight:900;color:var(--c);text-transform:uppercase;letter-spacing:.03em}
.tk.done .tk-tx{color:var(--mu);text-decoration:line-through}
.mes-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mes-dn{display:contents}
.mes-dn span{text-align:center;font:900 var(--t12)/1 var(--sans);color:var(--mu);text-transform:uppercase;letter-spacing:.05em;padding:4px 0}
.mes-c{min-height:120px;background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:4px 5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mes-c.fuera{opacity:.45}
.mes-c.pasado{background:color-mix(in srgb,var(--bg3) 50%,var(--card))}
.mes-c.hoy{border-color:var(--sel)}
.mes-n{align-self:flex-start;min-width:28px;height:26px;border:0;border-radius:8px;background:none;color:var(--mu);font:900 var(--t14)/1 var(--sans);padding:0 6px}
.mes-n:hover{background:var(--bg3);color:var(--tx)}
.mes-c.hoy .mes-n{background:var(--sel);color:#fff}
.tk.chico{padding:3px 5px;border-radius:7px;border-left-width:4px}
.tk.chico .tk-tx{font-size:var(--t12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mes-mas{border:0;background:none;color:var(--sel);font:800 var(--t12)/1 var(--sans);text-align:left;padding:2px 4px}

/* botones */
.b-fila{display:flex;gap:8px;flex-wrap:wrap}
.b-fila>*{flex:1}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:2px solid var(--bg3)}
.stepper>div:first-child{flex:1}
.stepper b{font-weight:900}
.stepper .ctl{display:flex;align-items:center;border:2px solid var(--ln2);border-bottom-width:4px;border-radius:14px;background:var(--card)}
.stepper .ctl button{width:44px;height:44px;border:0;background:none;font-size:var(--t20);font-weight:900;color:var(--sel)}
.stepper .ctl output{min-width:36px;text-align:center;font:900 var(--t16)/1 var(--sans)}
.ajuste-d{display:block;color:var(--mu);font-size:var(--t14);font-weight:600}

/* progreso */
.prot{overflow:hidden;color:#fff;background:linear-gradient(140deg,#FF9A3D 0%,#FF7A2F 55%,#F2611B 100%);border-color:#D9530F}
.prot::after{content:"🔥";position:absolute;right:18px;top:14px;font-size:46px;line-height:1;animation:flota 3s ease-in-out infinite}
.prot>*{position:relative;z-index:1}
.prot .rotulo{color:rgba(255,255,255,.85)}
.prot .cifra{display:block;font-size:56px;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.prot p{margin:4px 0 0;color:rgba(255,255,255,.95);font-size:var(--t14);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0}
.stats div{padding:10px;border-radius:14px;background:rgba(255,255,255,.18)}
.stats dt{font-size:var(--t12);font-weight:800;color:rgba(255,255,255,.85)}
.stats dd{margin:2px 0 0;font:900 var(--t20)/1.2 var(--sans)}
@media (prefers-color-scheme:dark){.prot{background:linear-gradient(140deg,#E3782A 0%,#CF5E1A 100%);border-color:#A84612}}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav div{text-align:center;font-weight:900}
.nav small{display:block;color:var(--mu);font-weight:700;font-size:var(--t14)}
.wk{display:grid;grid-template-columns:36px repeat(7,1fr);gap:4px;align-items:center;margin-bottom:4px}
.wk .dh{text-align:center;font-size:var(--t12);font-weight:800;color:var(--mu);line-height:1.3}
.wk .dh.today{color:var(--sel)}
.wk .le{font-size:20px;text-align:center}
.c{aspect-ratio:1;max-height:40px;width:100%;display:grid;place-items:center;font:900 var(--t12)/1 var(--sans);border:2px solid transparent;border-radius:12px;color:var(--tx)}
.s-ok{background:var(--acc);color:#fff;box-shadow:0 3px 0 var(--acc-sh)}
.s-miss{background:var(--neg-bg);color:var(--neg)}
.s-part{background:var(--warn-bg);color:var(--warn)}
.s-na{background:var(--bg3);color:var(--mu)}
.s-pend{border:2px dashed var(--ln2);color:var(--mu)}
.s-fut{border:2px solid var(--ln);color:var(--mu)}
.is-today{outline:3px solid var(--sel);outline-offset:1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{text-align:center;font-size:var(--t12);font-weight:800;color:var(--mu)}
button.c{padding:0;min-height:44px;max-height:none;aspect-ratio:auto;transition:transform 110ms var(--spring)}
button.c:active{transform:scale(.9)}
button.c:disabled{opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:var(--t12);font-weight:700;color:var(--mu)}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:4px;border-radius:4px}
.hitos{gap:0!important}
.hitos li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid var(--bg3);font-size:var(--t14);font-weight:800}
.hitos li:last-child{border-bottom:0}
.hitos li .ic{color:#fff;background:var(--warn-2);border-radius:10px;padding:5px;width:28px;height:28px;box-shadow:0 2px 0 #C98400}
.hitos li span:first-child{display:flex;align-items:center;gap:10px}
.hitos .prox{color:var(--mu)}
.hitos .bar{flex:none;width:88px;height:12px;border-radius:999px;background:var(--track);position:relative;overflow:hidden}
.hitos .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--warn-2)}

/* sistema */
.hc{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:10px 12px;background:var(--card);border:2px solid var(--ln);border-bottom-width:4px;border-radius:20px;text-align:left;color:inherit;position:relative;transition:transform 110ms var(--ease)}
.hc:active{transform:translateY(2px)}
.bloque .hc{border:0;border-radius:14px;padding:8px 6px;min-height:64px}
.bloque .lista{gap:2px}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{font:900 11px/1 var(--sans);font-style:normal;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--bg3);color:var(--mu)}
.dots i.on{background:var(--sel);color:#fff}

/* hojas */
.hoja h2{margin-bottom:8px}
.hoja .lb{display:block;font:900 var(--t12)/1.3 var(--sans);color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
.hoja input[type=text],.hoja input[type=time],.hoja input[type=date],.hoja input[type=number],.hoja select,.campo{width:100%;padding:0 14px;border-radius:14px;border:2px solid var(--ln2);background:var(--card);font-size:var(--t16);font-weight:700;min-height:50px;color:var(--tx)}
.hoja input:focus,.hoja select:focus{border-color:var(--sel)}

<script>
'use strict';
const LS = 'habitos-v1';
const DAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DL = ['D','L','M','M','J','V','S'];
const DFULL = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ORDER = [1,2,3,4,5,6,0];
/* Paleta de hábitos (tierra). Los colores viejos guardados se muestran con su equivalente: el dato no cambia. */
const COLORS = [
  { c: '#B04A30', n: 'terracota' }, { c: '#A87A2A', n: 'ocre' }, { c: '#5B6B4B', n: 'musgo' }, { c: '#7E8F74', n: 'salvia' },
  { c: '#4F5B66', n: 'pizarra' }, { c: '#7A4E5E', n: 'ciruela' }, { c: '#9C6B50', n: 'arcilla' }, { c: '#3A3631', n: 'tinta' }
];
const VIEJOS = { '#ff4b4b': 0, '#ff9600': 6, '#ffc800': 1, '#58cc02': 2, '#1cb0f6': 4, '#2b70c9': 4, '#ce82ff': 5, '#ff86d0': 5 };
const colorDe = h => { const c = (h.color || '').toLowerCase(); return c in VIEJOS ? COLORS[VIEJOS[c]].c : (h.color || COLORS[7].c); };
const QUICK = ['💻','📐','🏋️','🏃','📚','🧘','💧','🥗','😴','🎸','✍️','🧹'];
const ic = (n, cls) => `<svg class="ic ${cls || ''}" aria-hidden="true"><use href="ui/icons.svg#i-${n}"/></svg>`;
const TILDE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayKey = () => key(new Date());
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fecha = k => { const d = parse(k); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };

/* ---------- datos (mismo formato de siempre; weekMin y hito son opcionales y nuevos) ---------- */
function seed() {
  const t = todayKey();
  const h = (name, emoji, color, days, time, times) => ({ id: uid(), name, emoji, color, days, time: time || '', times: times || {}, since: t, routine: null });
  return normalize({
    habits: [
      h('Desarrollo (Mieza / Tablero 360)', '💻', COLORS[4].c, [1,2,3,4,5], '07:00'),
      h('Matemática V', '📐', COLORS[5].c, [1,2,3,4,5], '', {1:'08:00',3:'08:00',2:'20:00',4:'20:00',5:'20:00'}),
      h('Gym', '🏋️', COLORS[6].c, [1,3,5], '19:00'),
      h('5k', '🏃', COLORS[2].c, [0], '')
    ]
  });
}
function normalize(s) {
  s.habits = Array.isArray(s.habits) ? s.habits : [];
  s.routines = Array.isArray(s.routines) ? s.routines : [];
  s.log = s.log && typeof s.log === 'object' ? s.log : {};
  s.settings = Object.assign({ goal: 2, sound: true }, s.settings);
  // pendientes: los no hechos pasan al día siguiente; los hechos de días anteriores se van
  const hoy = todayKey();
  s.pend = (Array.isArray(s.pend) ? s.pend : []).filter(p => p && p.t && !(p.done && diasEntreK(p.done, hoy) > 90)); // lo hecho queda 90 días para verlo en semana y mes
  s.habits.forEach(h => { h.days = h.days || []; h.times = h.times || {}; h.time = h.time || ''; h.since = h.since || todayKey(); h.routine = h.routine || null; });
  return s;
}
const diasEntreK = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const weekMin = () => S.settings.weekMin || 4;
function load() {
  try { const s = JSON.parse(localStorage.getItem(LS)); if (s && Array.isArray(s.habits)) return normalize(s); } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} if (window.Sync) Sync.touch('habitos'); }
let S = load(); save();
const V = { tab: 'hoy', week: 0, month: 0 };
let openDay = null, ED = null, animar = null;

/* ---------- lógica del día ---------- */
const timeFor = (h, dow) => (h.times && h.times[dow]) || h.time || '';
const due = (h, k) => k >= h.since && h.days.includes(parse(k).getDay());
const isDone = (h, k) => (S.log[k] || []).includes(h.id);
function dayInfo(k) {
  const list = S.habits.filter(h => due(h, k));
  return { list, due: list.length, done: list.filter(h => isDone(h, k)).length };
}
const met = i => i.due > 0 && i.done >= Math.min(S.settings.goal, i.due);
const complete = i => i.due > 0 && i.done === i.due;
const sesiones = h => Object.keys(S.log).filter(k => k <= todayKey() && S.log[k].includes(h.id)).length;
function pct(from, to) {
  const today = todayKey();
  let n = 0, dn = 0;
  for (let d = from; d <= to; d = addDays(d, 1)) {
    const k = key(d);
    if (k > today) break;
    // El día en curso no cuenta como fallado: suma solo lo que ya hiciste, lo pendiente no baja el %.
    const i = dayInfo(k); n += k === today ? i.done : i.due; dn += i.done;
  }
  return n ? Math.round(dn / n * 100) : null;
}
const weekStart = off => { const t = new Date(); t.setHours(0,0,0,0); return addDays(t, -((t.getDay() + 6) % 7) + off * 7); };
const monthRef = off => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth() + off, 1); };
function habitState(h, k) {
  if (!due(h, k)) return 'na';
  if (isDone(h, k)) return 'ok';
  const t = todayKey();
  return k > t ? 'fut' : k === t ? 'pend' : 'miss';
}
function dayState(k) {
  const i = dayInfo(k), t = todayKey();
  if (!i.due) return 'na';
  if (i.done === i.due) return 'ok';
  if (k > t) return 'fut';
  if (k === t) return i.done ? 'part' : 'pend';
  return i.done ? 'part' : 'miss';
}
const STATE_TXT = { ok: 'cumplido', miss: 'fallado', part: 'parcial', na: 'no aplicaba', pend: 'pendiente', fut: 'todavía no' };

/* ---------- indicador común ---------- */
function renderPulso() {
  const p = Comun.pulso(), priv = Comun.privado();
  const partes = [];
  if (p.habitos) partes.push(p.habitos.estado === 'buena'
    ? `<a href="#prog" class="ok">Semana buena · <b>${p.habitos.cumplidos}</b> ${p.habitos.cumplidos === 1 ? 'día' : 'días'}</a>`
    : `<a href="#prog">Semana <b>${p.habitos.cumplidos} de ${p.habitos.minimo}</b> días</a>`);

  let ctl = '';
  if (f === 'listo') ctl = `<div class="ar-pre" role="group" aria-label="Minutos">${PRESETS.map(m => `<button data-act="arMin" data-n="${m}" class="${m === min ? 'on' : ''}" aria-pressed="${m === min}">${m}'</button>`).join('')}</div>
    <div class="ar-fila"><button class="ar-b azul chico" data-act="arMas" data-n="-1" aria-label="Un minuto menos">−1'</button><button class="ar-b verde grande" data-act="arStart" id="ar-main">${ic('play')}Start</button><button class="ar-b azul chico" data-act="arMas" data-n="1" aria-label="Un minuto más">+1'</button></div>`;
  else if (f === 'juego' || f === 'pausa') ctl = `<div class="ar-fila"><button class="ar-b azul chico" data-act="arReset">${ic('rotate-ccw')}Reset</button><button class="ar-b ${f === 'juego' ? 'oro' : 'verde'} grande" data-act="arPausa" id="ar-main">${ic(f === 'juego' ? 'pause' : 'play')}${f === 'juego' ? 'Pausa' : 'Seguir'}</button><button class="ar-b verde chico" data-act="arFin">${ic('check')}Listo</button></div>`;
  else if (f === 'fin') ctl = `<div class="ar-fila">${hoy && !hecho ? `<button class="ar-b verde grande" data-act="arHecho" id="ar-main">${ic('check')}Marcar</button>` : ''}<button class="ar-b azul chico" data-act="arOtra" ${hoy && !hecho ? '' : 'id="ar-main"'}>${ic('rotate-ccw')}Otra</button><button class="ar-b rojo chico" data-act="arSalir">${ic('x')}Salir</button></div>`;
  const centro = f === 'fin'
    ? `<p class="ar-gano">${T.marcado ? (esP() ? '¡Tarea hecha!' : '+1 sesión') : T.temprano ? '¡Nivel superado!' : '¡Tiempo!'}</p><p class="ar-estado blink">${T.marcado && esP() ? 'Tachada de pendientes' : T.marcado ? `${n} ${n === 1 ? 'sesión' : 'sesiones'} en total` : hecho ? 'Ya estaba hecho hoy' : hoy ? 'Marcalo como hecho' : 'Hoy no estaba programado'}</p>`
    : `<div class="ar-reloj" id="ar-reloj" role="timer" aria-label="Tiempo restante">${mmss(restante())}</div><div class="ar-vida" id="ar-vida" aria-hidden="true">${'<i></i>'.repeat(SEG)}</div><p class="ar-estado ${f === 'listo' || f === 'pausa' ? 'blink' : ''}">${estado}</p>`;
  $('#arcade').innerHTML = `<header class="ar-top"><span class="p1">1UP</span><span class="pts">${esP() ? esc(areaInfo(areaP(h)).n) : `Sesiones ${String(n).padStart(3, '0')}`}</span><button class="ar-x" data-act="arSalir" aria-label="Salir del modo arcade">${ic('x')}</button></header>
    <div class="ar-centro"><span class="ar-emo" aria-hidden="true">${esc(emoji)}</span><h2 class="ar-nm">${esc(nm)}</h2>${desc ? `<p class="ar-desc">${esc(desc)}</p>` : ''}${centro}</div>
    <div class="ar-ctl">${ctl}</div>`;
  tickArcade(true);
  const m = $('#ar-main'); if (m) m.focus({ preventScroll: true });
}
function tickArcade(soloPintar) {
  if (!T) return;
  const r = restante();
  if (T.fase === 'juego' && r <= 0 && !soloPintar) return finArcade(false);
  const rel = $('#ar-reloj'); if (!rel) return;
  rel.textContent = mmss(r);
  const on = Math.ceil(r / T.total * SEG);
  $$('#ar-vida i').forEach((i, ix) => i.classList.toggle('off', ix >= on));
  const a = $('#arcade');
  a.classList.toggle('bajo', T.fase !== 'listo' && r <= Math.min(60000, T.total * .2));
  a.classList.toggle('critico', T.fase === 'juego' && r <= 10000);
  const h = habT();
  document.title = T.fase === 'juego' || T.fase === 'pausa' ? `${mmss(r)} · ${h ? datosT(h).nm : ''}` : 'Hábitos';
}
function arrancar() {
  const h = habT();
  if (h && Math.round(T.total / 60000) !== h.min) { h.min = Math.round(T.total / 60000); save(); } // recuerda el último tiempo
  T.fase = 'cuenta'; guardarT(); pintarArcade();
  const caja = document.createElement('div'); caja.className = 'ar-cuenta'; caja.setAttribute('aria-live', 'assertive'); $('#arcade').appendChild(caja);
  const pasos = Comun.reduce() ? ['¡YA!'] : ['3', '2', '1', '¡YA!'];
  pasos.forEach((p, i) => cuentaT.push(setTimeout(() => {
    caja.innerHTML = `<span class="${p === '¡YA!' ? 'ya' : ''}">${p}</span>`;
    chime([p === '¡YA!' ? 880 : 440], BEEP);
  }, i * 700)));
  cuentaT.push(setTimeout(() => {
    cuentaT = []; caja.remove();
    T.fase = 'juego'; T.fin = Date.now() + T.rest; guardarT(); pedirWake(); pintarArcade();
  }, pasos.length * 700));
}
function finArcade(temprano) {
  T.rest = 0; T.fin = null; T.fase = 'fin'; T.temprano = temprano; guardarT(); soltarWake();
  if (!temprano) { chime([523, 659, 784, 1047, 784, 1047, 1319], Object.assign({ siempre: true, paso: .13 }, BEEP)); Comun.haptic([200, 100, 200, 100, 400]); }
  pintarArcade();
}
function accionArcade(a, d, t) {
  if (!T) return;
  const h = habT();
  switch (a) {
    case 'arMin': T.total = T.rest = +d.n * 60000; guardarT(); pintarArcade(); break;
    case 'arMas': { const m = Math.max(1, Math.min(180, Math.round(T.total / 60000) + +d.n)); T.total = T.rest = m * 60000; guardarT(); pintarArcade(); break; }
    case 'arStart': pantallaCompleta(true); arrancar(); break;
    case 'arPausa':
      if (T.fase === 'juego') { T.rest = restante(); T.fin = null; T.fase = 'pausa'; soltarWake(); }
      else { T.fin = Date.now() + T.rest; T.fase = 'juego'; pedirWake(); }
      chime([T.fase === 'juego' ? 660 : 330], BEEP); guardarT(); pintarArcade(); break;
    case 'arReset': T.rest = T.total; T.fin = null; T.fase = 'listo'; soltarWake(); guardarT(); pintarArcade(); break;
    case 'arFin': finArcade(true); break;
    case 'arOtra': T.rest = T.total; T.fase = 'listo'; T.marcado = false; guardarT(); pintarArcade(); break;
    case 'arHecho':
      if (h && !datosT(h).hecho) { T.marcado = true; if (esP()) tickPend(h.id); else toggle(h.id, todayKey(), true); }
      pintarArcade(); break;
    case 'arSalir': cerrarArcade(); break;
  }
}
(function retomarArcade() {
  try {
    const t = JSON.parse(localStorage.getItem(LS_T));
    if (!t || !(t.tipo === 'p' ? S.pend : S.habits).some(h => h.id === t.id) || !(t.total > 0)) { localStorage.removeItem(LS_T); return; }
    T = t;
    if (T.fase === 'cuenta') T.fase = 'listo';
    if (T.fase === 'juego' && restante() <= 0) { T.rest = 0; T.fin = null; T.fase = 'fin'; }
    mostrarArcade();
  } catch (e) {}
})();

</script>
