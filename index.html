<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hábitos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuaderno">
<meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101820" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="preload" href="ui/fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="ui/base.css">
<style>
/* Hábitos sobre la base compartida (ui/base.css). Solo lo propio de esta app. */
body.lock{overflow:hidden}
main{max-width:640px;margin:0 auto;padding:8px 16px 0}
.sub{margin:4px 0 16px;color:var(--mu);font-size:var(--t14);font-weight:700}.sub::first-letter{text-transform:uppercase}
.bloque,.dia-estado,.prot,.semana{position:relative;background:var(--card);border:2px solid var(--ln);border-bottom-width:4px;border-radius:var(--r-l);padding:16px 18px;margin:0 0 14px}
.bloque-h{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:8px}
.t12{font-size:var(--t12)}.t14{font-size:var(--t14)}
.vacio{padding:24px 0;color:var(--mu)}

/* estado del día: tarjeta naranja con fuego */
.dia-estado{overflow:hidden;color:#fff;background:linear-gradient(140deg,#FF9A3D 0%,#FF7A2F 55%,#F2611B 100%);border-color:#D9530F;padding:20px 18px 18px}
.dia-estado::before{content:"";position:absolute;width:200px;height:200px;right:-60px;top:-80px;border-radius:50%;background:rgba(255,255,255,.14)}
.dia-estado::after{content:"🔥";position:absolute;right:18px;top:14px;font-size:46px;line-height:1;animation:flota 3s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.dia-estado>*{position:relative;z-index:1}
.dia-estado .rotulo,.dia-estado .mu{color:rgba(255,255,255,.85)!important}
.dia-estado .cifra{display:block;font-size:48px;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.dia-estado p{margin:10px 0 0;color:rgba(255,255,255,.95);font-size:var(--t14);font-weight:800}
.dia-estado.completo{background:linear-gradient(140deg,#22C468 0%,#12A453 55%,#0E8F49 100%);border-color:#0C7F3F}
.dia-estado.completo::after{content:"🏆"}
.regla{position:relative;height:18px;background:rgba(0,0,0,.18);margin-top:14px;border-radius:999px}
.regla>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#fff;min-width:18px;transition:width 500ms var(--spring)}
.regla>i[style*="width:0%"]{min-width:0}
.regla>em{position:absolute;top:-4px;bottom:-4px;width:4px;border-radius:4px;background:#fff;opacity:.7}
@media (prefers-color-scheme:dark){.dia-estado{background:linear-gradient(140deg,#E3782A 0%,#CF5E1A 100%);border-color:#A84612}.dia-estado.completo{background:linear-gradient(140deg,#1C9E55 0%,#0E6535 100%);border-color:#0B5A2F}}

/* semana en curso */
.sem{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.sem div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:var(--t12);font-weight:800;color:var(--mu)}
.sem i{display:grid;place-items:center;width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;background:var(--track);font-style:normal}
.sem .met i{background:var(--naranja);box-shadow:0 3px 0 #D9530F}
.sem .met i::after{content:"🔥";font-size:16px}
.sem .hoy b{color:var(--sel)}
.sem .hoy i{box-shadow:inset 0 0 0 3px var(--sel)}
.sem .met.hoy i{box-shadow:0 3px 0 #D9530F,inset 0 0 0 3px var(--sel)}
.sem .libre i{background:none;border:2px dashed var(--ln2)}
.regla-sem{margin:12px 0 0;font-size:var(--t14);color:var(--mu)}
.regla-sem b{color:var(--tx);font-weight:900}
.regla-sem.ok b{color:var(--naranja)}

/* lista de hábitos de hoy: cada uno una card */
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 8px}
.lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;min-height:76px;padding:10px 10px 10px 12px;background:var(--card);border:2px solid var(--ln);border-bottom-width:4px;border-radius:20px;position:relative;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.emo-i{width:48px;height:48px;flex:none;display:grid;place-items:center;font-size:26px;border-radius:16px;background:color-mix(in srgb,var(--c,var(--sel)) 16%,var(--card))}
.txt{flex:1;min-width:0}
.nm{display:block;font-weight:900;font-size:var(--t16);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;color:var(--mu);font-size:var(--t14);font-weight:700;margin-top:2px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.item.done{background:var(--pos-bg);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.item.done .nm{color:var(--pos)}
.chk{width:54px;height:54px;flex:none;border-radius:16px;border:2px solid var(--ln2);border-bottom-width:5px;background:var(--card);color:#fff;display:grid;place-items:center;padding:0;transition:transform 110ms var(--ease),background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.chk:active{transform:translateY(3px);border-bottom-width:2px}
.chk svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.done .chk{background:var(--acc);border-color:var(--acc-sh)}
.done .chk svg{opacity:1}
.chk.anim{animation:rebote 460ms var(--spring)}
.chk.anim svg path{stroke-dasharray:24;animation:trazo 260ms var(--ease)}

/* botones */
.b-fila{display:flex;gap:8px;flex-wrap:wrap}
.b-fila>*{flex:1}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:2px solid var(--bg3)}
.stepper>div:first-child{flex:1}
.stepper b{font-weight:900}
.stepper .ctl{display:flex;align-items:center;border:2px solid var(--ln2);border-bottom-width:4px;border-radius:14px;background:var(--card)}
.stepper .ctl button{width:44px;height:44px;border:0;background:none;font-size:var(--t20);font-weight:900;color:var(--sel)}
.stepper .ctl output{min-width:36px;text-align:center;font:900 var(--t16)/1 var(--sans)}
.ajuste-d{display:block;color:var(--mu);font-size:var(--t14);font-weight:600}

/* progreso */
.prot{overflow:hidden;color:#fff;background:linear-gradient(140deg,#FF9A3D 0%,#FF7A2F 55%,#F2611B 100%);border-color:#D9530F}
.prot::after{content:"🔥";position:absolute;right:18px;top:14px;font-size:46px;line-height:1;animation:flota 3s ease-in-out infinite}
.prot>*{position:relative;z-index:1}
.prot .rotulo{color:rgba(255,255,255,.85)}
.prot .cifra{display:block;font-size:56px;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.prot p{margin:4px 0 0;color:rgba(255,255,255,.95);font-size:var(--t14);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0}
.stats div{padding:10px;border-radius:14px;background:rgba(255,255,255,.18)}
.stats dt{font-size:var(--t12);font-weight:800;color:rgba(255,255,255,.85)}
.stats dd{margin:2px 0 0;font:900 var(--t20)/1.2 var(--sans)}
@media (prefers-color-scheme:dark){.prot{background:linear-gradient(140deg,#E3782A 0%,#CF5E1A 100%);border-color:#A84612}}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav div{text-align:center;font-weight:900}
.nav small{display:block;color:var(--mu);font-weight:700;font-size:var(--t14)}
.wk{display:grid;grid-template-columns:36px repeat(7,1fr);gap:4px;align-items:center;margin-bottom:4px}
.wk .dh{text-align:center;font-size:var(--t12);font-weight:800;color:var(--mu);line-height:1.3}
.wk .dh.today{color:var(--sel)}
.wk .le{font-size:20px;text-align:center}
.c{aspect-ratio:1;max-height:40px;width:100%;display:grid;place-items:center;font:900 var(--t12)/1 var(--sans);border:2px solid transparent;border-radius:12px;color:var(--tx)}
.s-ok{background:var(--acc);color:#fff;box-shadow:0 3px 0 var(--acc-sh)}
.s-miss{background:var(--neg-bg);color:var(--neg)}
.s-part{background:var(--warn-bg);color:var(--warn)}
.s-na{background:var(--bg3);color:var(--mu)}
.s-pend{border:2px dashed var(--ln2);color:var(--mu)}
.s-fut{border:2px solid var(--ln);color:var(--mu)}
.is-today{outline:3px solid var(--sel);outline-offset:1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{text-align:center;font-size:var(--t12);font-weight:800;color:var(--mu)}
button.c{padding:0;min-height:44px;max-height:none;aspect-ratio:auto;transition:transform 110ms var(--spring)}
button.c:active{transform:scale(.9)}
button.c:disabled{opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:var(--t12);font-weight:700;color:var(--mu)}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:4px;border-radius:4px}
.hitos{gap:0!important}
.hitos li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid var(--bg3);font-size:var(--t14);font-weight:800}
.hitos li:last-child{border-bottom:0}
.hitos li .ic{color:#fff;background:var(--warn-2);border-radius:10px;padding:5px;width:28px;height:28px;box-shadow:0 2px 0 #C98400}
.hitos li span:first-child{display:flex;align-items:center;gap:10px}
.hitos .prox{color:var(--mu)}
.hitos .bar{flex:none;width:88px;height:12px;border-radius:999px;background:var(--track);position:relative;overflow:hidden}
.hitos .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--warn-2)}

/* sistema */
.hc{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:10px 12px;background:var(--card);border:2px solid var(--ln);border-bottom-width:4px;border-radius:20px;text-align:left;color:inherit;position:relative;transition:transform 110ms var(--ease)}
.hc:active{transform:translateY(2px)}
.bloque .hc{border:0;border-radius:14px;padding:8px 6px;min-height:64px}
.bloque .lista{gap:2px}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{font:900 11px/1 var(--sans);font-style:normal;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--bg3);color:var(--mu)}
.dots i.on{background:var(--sel);color:#fff}

/* hojas */
.hoja h2{margin-bottom:8px}
.hoja .lb{display:block;font:900 var(--t12)/1.3 var(--sans);color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
.hoja input[type=text],.hoja input[type=time],.hoja input[type=date],.hoja input[type=number],.hoja select,.campo{width:100%;padding:0 14px;border-radius:14px;border:2px solid var(--ln2);background:var(--card);font-size:var(--t16);font-weight:700;min-height:50px;color:var(--tx)}
.hoja input:focus,.hoja select:focus{border-color:var(--sel)}
.hoja input[type=time],.hoja input[type=date]{-webkit-appearance:none;appearance:none}
.er{display:flex;gap:8px}
.emo{width:72px!important;text-align:center;font-size:26px!important;flex:none}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{width:46px;height:46px;border:2px solid var(--ln);border-bottom-width:4px;border-radius:14px;background:var(--card);font-size:22px;padding:0;transition:transform 110ms var(--spring)}
.quick button:active{transform:scale(.9)}
.chips{display:flex;gap:6px}
.dchip{flex:1;min-height:46px;padding:0;border:2px solid var(--ln2);border-bottom-width:4px;border-radius:14px;background:var(--card);font:900 var(--t14)/1 var(--sans)}
.dchip.on{background:var(--sel-bg);border-color:var(--sel);color:var(--sel)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid var(--card);padding:0;position:relative;box-shadow:0 0 0 2px var(--ln)}
.sw button.on{box-shadow:0 0 0 3px var(--tx);animation:rebote 360ms var(--spring)}
.trow{display:flex;align-items:center;gap:10px;margin-top:6px}
.trow span{width:44px;font-weight:900}
.per{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:8px;font-size:var(--t14)}
.per input{width:22px;height:22px;accent-color:var(--acc)}
.form-pie{display:flex;gap:8px;margin-top:24px}
.form-pie>*{flex:1}
.zona-borrar{margin-top:40px;padding-top:16px;border-top:2px solid var(--bg3);display:flex;justify-content:center}
.dayrow{display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:2px solid var(--bg3)}
.semana dl{margin:8px 0 0;display:grid;gap:6px}
.semana dl>div{display:grid;grid-template-columns:88px 1fr;gap:8px;font-size:var(--t14)}
.semana dt{color:var(--mu);font-weight:900}.semana dd{margin:0}
.semana>.rotulo::before{content:"🗓️ "}
.syncbox .st{font-size:var(--t14);margin:4px 0 0}
@media (min-width:900px){main{max-width:760px;margin:0;padding:24px 40px 48px}}
</style>
</head>

<script>
'use strict';
const LS = 'habitos-v1';
const DAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DL = ['D','L','M','M','J','V','S'];
const DFULL = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ORDER = [1,2,3,4,5,6,0];
/* Paleta de hábitos (tierra). Los colores viejos guardados se muestran con su equivalente: el dato no cambia. */
const COLORS = [
  { c: '#B04A30', n: 'terracota' }, { c: '#A87A2A', n: 'ocre' }, { c: '#5B6B4B', n: 'musgo' }, { c: '#7E8F74', n: 'salvia' },
  { c: '#4F5B66', n: 'pizarra' }, { c: '#7A4E5E', n: 'ciruela' }, { c: '#9C6B50', n: 'arcilla' }, { c: '#3A3631', n: 'tinta' }
];
const VIEJOS = { '#ff4b4b': 0, '#ff9600': 6, '#ffc800': 1, '#58cc02': 2, '#1cb0f6': 4, '#2b70c9': 4, '#ce82ff': 5, '#ff86d0': 5 };
const colorDe = h => { const c = (h.color || '').toLowerCase(); return c in VIEJOS ? COLORS[VIEJOS[c]].c : (h.color || COLORS[7].c); };
const QUICK = ['💻','📐','🏋️','🏃','📚','🧘','💧','🥗','😴','🎸','✍️','🧹'];
const ic = (n, cls) => `<svg class="ic ${cls || ''}" aria-hidden="true"><use href="ui/icons.svg#i-${n}"/></svg>`;
const TILDE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayKey = () => key(new Date());
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fecha = k => { const d = parse(k); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };

/* ---------- datos (mismo formato de siempre; weekMin y hito son opcionales y nuevos) ---------- */
function seed() {
  const t = todayKey();
  const h = (name, emoji, color, days, time, times) => ({ id: uid(), name, emoji, color, days, time: time || '', times: times || {}, since: t, routine: null });
  return normalize({
    habits: [
      h('Desarrollo (Mieza / Tablero 360)', '💻', COLORS[4].c, [1,2,3,4,5], '07:00'),
      h('Matemática V', '📐', COLORS[5].c, [1,2,3,4,5], '', {1:'08:00',3:'08:00',2:'20:00',4:'20:00',5:'20:00'}),
      h('Gym', '🏋️', COLORS[6].c, [1,3,5], '19:00'),
      h('5k', '🏃', COLORS[2].c, [0], '')
    ]
  });
}
function normalize(s) {
  s.habits = Array.isArray(s.habits) ? s.habits : [];
  s.routines = Array.isArray(s.routines) ? s.routines : [];
  s.log = s.log && typeof s.log === 'object' ? s.log : {};
  s.settings = Object.assign({ goal: 2, sound: true }, s.settings);
  s.habits.forEach(h => { h.days = h.days || []; h.times = h.times || {}; h.time = h.time || ''; h.since = h.since || todayKey(); h.routine = h.routine || null; });
  return s;
}
const weekMin = () => S.settings.weekMin || 4;
function load() {
  try { const s = JSON.parse(localStorage.getItem(LS)); if (s && Array.isArray(s.habits)) return normalize(s); } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} if (window.Sync) Sync.touch('habitos'); }
let S = load(); save();
const V = { tab: 'hoy', week: 0, month: 0 };
let openDay = null, ED = null, animar = null;

/* ---------- lógica del día ---------- */
const timeFor = (h, dow) => (h.times && h.times[dow]) || h.time || '';
const due = (h, k) => k >= h.since && h.days.includes(parse(k).getDay());
const isDone = (h, k) => (S.log[k] || []).includes(h.id);
function dayInfo(k) {
  const list = S.habits.filter(h => due(h, k));
  return { list, due: list.length, done: list.filter(h => isDone(h, k)).length };
}
const met = i => i.due > 0 && i.done >= Math.min(S.settings.goal, i.due);
const complete = i => i.due > 0 && i.done === i.due;
const sesiones = h => Object.keys(S.log).filter(k => k <= todayKey() && S.log[k].includes(h.id)).length;
function pct(from, to) {
  const today = todayKey();
  let n = 0, dn = 0;
  for (let d = from; d <= to; d = addDays(d, 1)) {
    const k = key(d);
    if (k > today) break;
    // El día en curso no cuenta como fallado: suma solo lo que ya hiciste, lo pendiente no baja el %.
    const i = dayInfo(k); n += k === today ? i.done : i.due; dn += i.done;
  }
  return n ? Math.round(dn / n * 100) : null;
}
const weekStart = off => { const t = new Date(); t.setHours(0,0,0,0); return addDays(t, -((t.getDay() + 6) % 7) + off * 7); };
const monthRef = off => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth() + off, 1); };
function habitState(h, k) {
  if (!due(h, k)) return 'na';
  if (isDone(h, k)) return 'ok';
  const t = todayKey();
  return k > t ? 'fut' : k === t ? 'pend' : 'miss';
}
function dayState(k) {
  const i = dayInfo(k), t = todayKey();
  if (!i.due) return 'na';
  if (i.done === i.due) return 'ok';
  if (k > t) return 'fut';
  if (k === t) return i.done ? 'part' : 'pend';
  return i.done ? 'part' : 'miss';
}
const STATE_TXT = { ok: 'cumplido', miss: 'fallado', part: 'parcial', na: 'no aplicaba', pend: 'pendiente', fut: 'todavía no' };

/* ---------- indicador común ---------- */
function renderPulso() {
  const p = Comun.pulso(), priv = Comun.privado();
  const partes = [];
  if (p.habitos) partes.push(p.habitos.estado === 'buena'
    ? `<a href="#prog" class="ok">Semana buena · <b>${p.habitos.cumplidos}</b> ${p.habitos.cumplidos === 1 ? 'día' : 'días'}</a>`
    : `<a href="#prog">Semana <b>${p.habitos.cumplidos} de ${p.habitos.minimo}</b> días</a>`);
  if (p.registro) partes.push(`<a href="finanzas/#/diario">Registro <b>${p.registro.dias} ${p.registro.dias === 1 ? 'día' : 'días'}</b></a>`);
  if (p.meta) partes.push(`<a href="finanzas/#/plan">Meta <b>${priv ? '**%' : Math.round(p.meta.pct * 100) + '%'}</b></a>`);
  $$('[data-pulso]').forEach(e => { e.innerHTML = partes.join(''); e.hidden = !partes.length; e.setAttribute('aria-label', 'Resumen de la semana'); });
}
function renderPrivado() {
  const p = Comun.privado();
  $$('[data-act="privado"]').forEach(b => { b.setAttribute('aria-pressed', String(p)); b.setAttribute('aria-label', p ? 'Mostrar montos' : 'Ocultar montos'); b.innerHTML = ic(p ? 'eye-off' : 'eye'); });
}

/* ---------- vistas ---------- */
function semanaHTML(se, titulo) {
  const r = Comun.rachaSemanas(S);
  const txt = se.estado === 'buena' || se.estado === 'libre' ? esc(Comun.fraseSemana(se))
    : se.posible ? `<b>${se.cumplidos} de ${se.minimo}</b> días con la meta diaria. Un día flojo no rompe nada.`
    : `<b>${se.cumplidos} de ${se.minimo}</b>. Esta semana ya no llega; la racha sigue hasta el domingo.`;
  return `<section class="bloque" aria-label="${titulo}">
    <div class="bloque-h"><h2>${titulo}</h2><span class="mu t14">${r.actual} ${r.actual === 1 ? 'semana buena seguida' : 'semanas buenas seguidas'}</span></div>
    <div class="sem">${se.dias.map(d => { const dw = parse(d.k).getDay(); return `<div class="${d.met ? 'met' : ''} ${d.hoy ? 'hoy' : ''} ${d.due ? '' : 'libre'}" title="${DFULL[dw]} ${parse(d.k).getDate()}: ${d.met ? 'meta cumplida' : d.due ? (d.futuro ? 'todavía no' : d.hoy ? 'en curso' : 'sin cumplir') : 'sin hábitos'}"><i></i><b>${DL[dw]}</b></div>`; }).join('')}</div>
    <p class="regla-sem ${se.estado === 'buena' ? 'ok' : ''}">${txt}</p>
  </section>`;
}
function resumenSemanaHTML() {
  const r = Comun.resumenSemana(), h = r.habitos, priv = Comun.privado();
  const usd = n => priv ? 'U$S ***' : 'U$S ' + Math.round(n).toLocaleString('es-AR');
  const f = k => { const d = parse(k); return `${d.getDate()}/${d.getMonth() + 1}`; };
  return `<section class="semana" aria-label="Resumen de la semana"><span class="rotulo">Domingo · semana del ${f(r.desde)} al ${f(r.hasta)}</span><dl>
    ${h ? `<div><dt>Hábitos</dt><dd>${esc(Comun.fraseSemana(h))}</dd></div>` : ''}
    ${r.gastos ? `<div><dt>Gastos</dt><dd>${r.gastos.cargados ? `Cargaste ${r.gastos.cargados} ${r.gastos.cargados === 1 ? 'gasto' : 'gastos'} en ${r.gastos.dias} ${r.gastos.dias === 1 ? 'día' : 'días'}.` : 'No cargaste gastos.'}</dd></div>` : ''}
    ${r.ahorro ? `<div><dt>Meta</dt><dd>${r.ahorro.usdSemana > 0 ? `Separaste ${usd(r.ahorro.usdSemana)}${r.ahorro.real != null && r.ahorro.meta ? `; vas por ${usd(r.ahorro.real)} de ${usd(r.ahorro.meta)}.` : '.'}` : 'Esta semana no separaste ahorro.'}</dd></div>` : ''}
  </dl></section>`;
}
function metaLine(h, dow) {
  const t = timeFor(h, dow), n = sesiones(h);
  return [t ? `<span>${ic('clock', 's')}${t}</span>` : '', `<span>${n} ${n === 1 ? 'sesión' : 'sesiones'}</span>`].join('');
}
function item(h, k, dow) {
  const d = isDone(h, k);
  return `<li class="item ${d ? 'done' : ''}" data-id="${h.id}" style="--c:${colorDe(h)}">
    <span class="emo-i" aria-hidden="true">${esc(h.emoji)}</span>
    <div class="txt"><span class="nm">${esc(h.name)}</span><span class="meta">${metaLine(h, dow)}</span></div>
    <button class="chk ${animar === h.id ? 'anim' : ''}" data-act="tick" data-id="${h.id}" aria-pressed="${d}" aria-label="${d ? 'Desmarcar' : 'Marcar'} ${esc(h.name)}">${TILDE}</button>
  </li>`;
}
function vHoy() {
  const now = new Date(), k = key(now), dow = now.getDay();
  const i = dayInfo(k);
  let out = `<h1>Hoy</h1><p class="sub">${DFULL[dow]} ${now.getDate()} de ${MONTHS[now.getMonth()]}</p>`;
  if (dow === 0) out += resumenSemanaHTML();
  if (!S.habits.length) return out + `<p class="vacio">Todavía no tenés hábitos. Creá el primero.</p><a class="b-pri" href="#hab" data-act="tab" data-t="hab">Crear hábito</a>`;
  if (!i.due) return out + `<section class="dia-estado"><span class="rotulo">Hoy</span><p>No hay nada programado. Descanso.</p></section>` + semanaHTML(Comun.semana(S, weekStart(0)), 'Esta semana');
  const goal = Math.min(S.settings.goal, i.due), ok = met(i), full = complete(i);
  const falta = goal - i.done;
  const msg = full ? `${i.done} de ${i.due}. Día completo.` : ok ? `Meta del día cumplida (${goal}). Lo que sigue suma.` : `${falta === 1 ? 'Falta 1' : 'Faltan ' + falta} para la meta del día (${goal}).`;
  out += `<section class="dia-estado ${full ? 'completo' : ''}" aria-live="polite">
    <span class="rotulo">Hábitos de hoy</span>
    <b class="cifra">${i.done} <span class="mu" style="font-size:var(--t28)">de ${i.due}</span></b>
    <div class="regla" aria-hidden="true"><i style="width:${i.done / i.due * 100}%"></i><em style="left:calc(${goal / i.due * 100}% - 1px)"></em></div>
    <p>${msg}</p>
  </section>`;
  const list = i.list.slice().sort((a, b) => (timeFor(a, dow) || '99').localeCompare(timeFor(b, dow) || '99') || a.name.localeCompare(b.name));
  const groups = [];
  S.routines.forEach(r => { const hs = list.filter(h => h.routine === r.id); if (hs.length) groups.push({ name: r.name, hs }); });
  const loose = list.filter(h => !S.routines.some(r => r.id === h.routine));
  if (loose.length) groups.push({ name: groups.length ? 'Otros' : null, hs: loose });
  out += groups.map(gr => `${gr.name ? `<div class="grp"><span class="rotulo">${esc(gr.name)}</span><span class="mu t14">${gr.hs.filter(h => isDone(h, k)).length} de ${gr.hs.length}</span></div>` : ''}<ul class="lista">${gr.hs.map(h => item(h, k, dow)).join('')}</ul>`).join('');
  out += semanaHTML(Comun.semana(S, weekStart(0)), 'Esta semana');
  return out;
}
function vProg() {
  const r = Comun.rachaSemanas(S), ws = weekStart(V.week), we = addDays(ws, 6), mr = monthRef(V.month), today = todayKey();
  const me = new Date(mr.getFullYear(), mr.getMonth() + 1, 0);
  const cws = weekStart(0), cm = monthRef(0), cme = new Date(cm.getFullYear(), cm.getMonth() + 1, 0);
  const f = v => v === null ? '–' : v + '%';
  let out = `<h1>Progreso</h1><p class="sub">Semana buena: la meta diaria en ${weekMin()} de 7 días</p>
  <section class="prot">
    <span class="rotulo">Semanas buenas seguidas</span>
    <b class="cifra">${r.actual}</b>
    <p>${r.estaSemana ? (r.estaSemana.estado === 'buena' ? `Esta semana: ${Comun.fraseSemana(r.estaSemana)}` : r.estaSemana.estado === 'libre' ? 'Esta semana no hay hábitos programados.' : `Esta semana: ${r.estaSemana.cumplidos} de ${r.estaSemana.minimo}. Un día flojo no corta la racha; solo una semana que termina sin llegar.`) : ''}</p>
    <dl class="stats"><div><dt>Récord</dt><dd>${r.mejor}</dd></div><div><dt>Esta semana</dt><dd>${f(pct(cws, addDays(cws, 6)))}</dd></div><div><dt>Este mes</dt><dd>${f(pct(cm, cme))}</dd></div></dl>
  </section>`;
  // hitos
  const H = Comun.hitos(S);
  const prox = H.proximos.slice().sort((a, b) => (b.hechas / b.meta) - (a.hechas / a.meta)).slice(0, 4);
  out += `<section class="bloque"><div class="bloque-h"><h2>Hitos</h2><span class="mu t14">${H.logrados.length} logrados</span></div><ul class="lista hitos">
    ${H.logrados.slice(0, 6).map(x => `<li><span>${ic('award', 's')}${esc(x.titulo)}</span><span class="mu">${fecha(x.fecha)}</span></li>`).join('')}
    ${prox.map(x => `<li class="prox"><span>${esc(x.titulo)}${x.propio ? ' · tu hito' : ''}</span><span class="bar" role="img" aria-label="${x.hechas} de ${x.meta}"><i style="width:${x.hechas / x.meta * 100}%"></i></span></li>`).join('')}
    ${!H.logrados.length && !prox.length ? '<li class="mu">Todavía no hay hitos.</li>' : ''}
  </ul></section>`;
  // semana
  const wlabel = V.week === 0 ? 'Esta semana' : `${ws.getDate()} ${MONTHS[ws.getMonth()].slice(0,3)} – ${we.getDate()} ${MONTHS[we.getMonth()].slice(0,3)}`;
  out += `<section class="bloque"><div class="nav"><button class="icon-btn" data-act="wk" data-n="-1" aria-label="Semana anterior">${ic('chevron-left')}</button><div>${wlabel}<small>Cumplimiento ${f(pct(ws, we))}</small></div><button class="icon-btn" data-act="wk" data-n="1" aria-label="Semana siguiente">${ic('chevron-right')}</button></div>
  <div class="wk" aria-hidden="true"><span></span>${ORDER.map((d, ix) => { const dd = addDays(ws, ix); return `<div class="dh ${key(dd) === today ? 'today' : ''}">${DL[d]}<br>${dd.getDate()}</div>`; }).join('')}</div>`;
  if (!S.habits.length) out += '<p class="vacio">Sin hábitos todavía</p>';
  S.habits.forEach(h => {
    out += `<div class="wk" role="group" aria-label="${esc(h.name)}"><div class="le" aria-hidden="true">${esc(h.emoji)}</div>${ORDER.map((d, ix) => { const dd = addDays(ws, ix), k = key(dd), s = habitState(h, k); return `<div class="c s-${s} ${k === today ? 'is-today' : ''}" role="img" aria-label="${DFULL[d]} ${dd.getDate()}: ${STATE_TXT[s]}">${s === 'ok' ? '✓' : s === 'miss' ? '·' : ''}</div>`; }).join('')}</div>`;
  });
  out += '</section>';
  // mes
  const lead = (mr.getDay() + 6) % 7;
  out += `<section class="bloque"><div class="nav"><button class="icon-btn" data-act="mo" data-n="-1" aria-label="Mes anterior">${ic('chevron-left')}</button><div>${MONTHS[mr.getMonth()]} ${mr.getFullYear()}<small>Cumplimiento ${f(pct(mr, me))}</small></div><button class="icon-btn" data-act="mo" data-n="1" aria-label="Mes siguiente">${ic('chevron-right')}</button></div>
  <div class="cal">${ORDER.map(d => `<div class="dh" aria-hidden="true">${DL[d]}</div>`).join('')}${'<span></span>'.repeat(lead)}`;
  for (let n = 1; n <= me.getDate(); n++) {
    const k = key(new Date(mr.getFullYear(), mr.getMonth(), n)), s = dayState(k);
    out += `<button class="c s-${s} ${k === today ? 'is-today' : ''}" data-act="day" data-k="${k}" ${k > today ? 'disabled' : ''} aria-label="${n} de ${MONTHS[mr.getMonth()]}: ${STATE_TXT[s]}">${n}</button>`;
  }
  out += `</div><div class="legend"><span><i style="background:var(--pos)"></i>Cumplido</span><span><i style="background:var(--warn-bg)"></i>Parcial</span><span><i style="background:var(--neg-bg)"></i>Fallado</span><span><i style="background:var(--bg3)"></i>No aplicaba</span></div>
  <p class="mu t14">Tocá un día para corregir lo que tildaste.</p></section>`;
  return out;
}
function vHab() {

  out += S.habits.map(h => {

  }).join('');

  out += `</ul><button class="b-sec" style="margin-top:12px" data-act="editR">${ic('plus', 's')}Nueva rutina</button></section>
  <section class="bloque" id="ajustes"><div class="bloque-h"><h2>Ajustes</h2></div>
    <div class="stepper"><div><b>Meta diaria</b><span class="ajuste-d">Hábitos por día para que el día cuente</span></div>
      <div class="ctl" role="group" aria-label="Meta diaria"><button data-act="goal" data-n="-1" aria-label="Menos">−</button><output>${S.settings.goal}</output><button data-act="goal" data-n="1" aria-label="Más">+</button></div></div>
    <div class="stepper"><div><b>Semana buena</b><span class="ajuste-d">Días con la meta diaria, de 7. Si la semana tiene menos días programados, baja solo.</span></div>
      <div class="ctl" role="group" aria-label="Días para una semana buena"><button data-act="wmin" data-n="-1" aria-label="Menos">−</button><output>${weekMin()}</output><button data-act="wmin" data-n="1" aria-label="Más">+</button></div></div>
    <div class="stepper"><div><b>Sonido</b><span class="ajuste-d">Un clic corto al marcar</span></div><button class="b-sec" data-act="sound" aria-pressed="${!!S.settings.sound}">${S.settings.sound ? 'Sí' : 'No'}</button></div>
  </section>
  <section class="bloque"><div class="bloque-h"><h2>Cuenta y sincronización</h2></div><div class="syncbox" id="syncbox"></div></section>
  <section class="bloque"><div class="bloque-h"><h2>Respaldo</h2></div>
    <div class="b-fila"><button class="b-sec" data-act="export">${ic('download', 's')}Exportar</button><button class="b-sec" data-act="import">${ic('upload', 's')}Importar</button></div>
    <p id="datanote" class="mu t14"></p></section>`;
  return out;
}
function syncText(i) {
  if (i.status === 'ok') return { t: 'Sincronizado', c: 'var(--pos)', n: 'ok' };
  if (i.status === 'pending') return { t: i.pendientes && i.pendientes.length ? 'Pendiente de subir: ' + i.pendientes.join(' y ') : 'Sincronizando…', c: 'var(--warn)', n: 'pend' };
  const s = i.retryAt ? Math.max(0, Math.round((i.retryAt - Date.now()) / 1000)) : 0;
  return { t: 'Error al sincronizar' + (i.error ? ' (' + i.error + ')' : '') + (s ? '. Reintento en ' + s + ' s' : ''), c: 'var(--neg)', n: 'err' };
}
function renderSync(i) {
  i = i || Sync.info();
  // punto de estado en la barra
  $$('.sync-slot').forEach(sl => {
    if (!i.enabled || i.status === 'out') { sl.innerHTML = ''; return; }
    const st = syncText(i);
    sl.innerHTML = `<a class="icon-btn" href="#hab-syncbox" data-act="tab" data-t="hab" data-ancla="syncbox" aria-label="Sincronización: ${esc(st.t)}" title="${esc(st.t)}"><span class="sync-dot ${st.n}" aria-hidden="true"></span></a>`;
  });
  const note = $('#datanote');
  if (note) note.textContent = !i.enabled || i.status === 'out' ? 'Tus datos están solo en este dispositivo. Exportá una copia de vez en cuando.' : 'Tus datos se guardan en este dispositivo y se copian a la nube con tu cuenta. Exportar te deja una copia aparte.';
  const b = $('#syncbox'); if (!b) return;
  if (!i.enabled) { b.innerHTML = '<p class="mu t14">Sincronización apagada: tus datos viven solo en este dispositivo.</p>'; return; }
  if (i.status === 'out') {
    if ($('#sy-mail')) return; // no pisar lo que se está escribiendo
    b.innerHTML = `<p class="mu t14">Sin sesión: tus datos están solo en este dispositivo. Entrá para copiarlos a la nube.</p>
      <input class="campo" type="text" id="sy-mail" inputmode="email" autocapitalize="none" autocomplete="username" placeholder="Email" aria-label="Email" style="margin-bottom:8px">
      <input class="campo" type="password" id="sy-pass" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" style="margin-bottom:8px">
      <p id="sy-err" style="color:var(--neg);font-size:var(--t14);min-height:1em;margin:0 0 8px"></p>
      <button class="b-pri b-ancho" data-act="syncLogin">Entrar</button>`;
    return;
  }
  const st = syncText(i);
  b.innerHTML = `<b>${esc(i.email)}</b><p class="st" role="status" style="color:${st.c}">${esc(st.t)}</p>
    <div class="b-fila" style="margin-top:10px"><button class="b-sec" data-act="syncNow">${i.status === 'error' ? 'Reintentar ahora' : 'Sincronizar'}</button><button class="b-sec" data-act="syncOut">Salir</button></div>`;
}
setInterval(() => { if (window.Sync && Sync.info().status === 'error') renderSync(); }, 1000);

let tabPintada = null;
function render() {
  const view = $('#view');
  view.classList.toggle('entra', V.tab !== tabPintada); tabPintada = V.tab;
  view.innerHTML = V.tab === 'hoy' ? vHoy() : V.tab === 'prog' ? vProg() : vHab();
  $$('[data-act="tab"][data-t]').forEach(b => { if (!b.dataset.ancla) { if (b.dataset.t === V.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); } });
  if (openDay) fillDay();
  if (window.Sync) renderSync();
  renderPulso(); renderPrivado();
  animar = null;
}

/* ---------- acciones ---------- */
function toggle(hid, k, fromSheet) {
  const antes = Comun.hitos(S).logrados.map(x => x.id);
  const semAntes = Comun.semana(S, Comun.lunes(parse(k))).estado;
  const arr = S.log[k] || (S.log[k] = []);
  const ix = arr.indexOf(hid), on = ix < 0;
  if (on) arr.push(hid); else arr.splice(ix, 1);
  if (!arr.length) delete S.log[k];
  save();
  if (on) animar = hid;
  render();
  if (!on) { hideToast(); return; }
  // feedback mínimo: el tilde se dibuja, un clic corto y una vibración breve
  click(); Comun.haptic(10);
  Comun.chispas(document.querySelector(`.item[data-id="${hid}"] .chk`));
  const h = S.habits.find(x => x.id === hid);
  if (!fromSheet) toast(`Marcado: ${h.name}.`, () => toggle(hid, k, fromSheet));
  // celebración solo en hitos: semana buena o un hito nuevo
  const nuevos = Comun.hitos(S).logrados.filter(x => !antes.includes(x.id));
  const sem = Comun.semana(S, Comun.lunes(parse(k)));
  if (sem.estado === 'buena' && semAntes !== 'buena') { const n = Comun.rachaSemanas(S).actual; sello('Semana buena', Comun.fraseSemana(sem), n === 1 ? 'Primera de la racha.' : `${n} seguidas.`); }
  else if (nuevos.length) sello('Hito', nuevos[0].titulo + '.', nuevos.length > 1 ? `Y ${nuevos.length - 1} más.` : '');
}
let selloT;
function sello(rot, titulo, det) {
  const s = $('#sello-slot');
  s.innerHTML = `<div class="sello" role="status"><span class="rotulo">${esc(rot)}</span><b>${esc(titulo)}</b>${det ? `<p>${esc(det)}</p>` : ''}<button class="icon-btn" data-act="cerrarSello" aria-label="Cerrar">${ic('x')}</button></div>`;
  chime([523, 784]);
  clearTimeout(selloT); selloT = setTimeout(() => { s.innerHTML = ''; }, 6000);
}
let ac;
function chime(notes) {
  if (!S.settings.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    notes.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * .1;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + .18);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .2);
    });
  } catch (e) {}
}
const click = () => chime([880]);
let toastT, toastUndo = null;
function toast(msg, undo) {
  const t = $('#toast'); t.querySelector('span').textContent = msg;
  const b = t.querySelector('button'); b.hidden = !undo; toastUndo = undo || null;
  t.classList.add('on'); document.body.classList.add('con-aviso');
  clearTimeout(toastT); toastT = setTimeout(hideToast, undo ? 8000 : 3000);
}
function hideToast() { $('#toast').classList.remove('on'); document.body.classList.remove('con-aviso'); toastUndo = null; }
$('#toast button').addEventListener('click', () => { const u = toastUndo; hideToast(); if (u) u(); });

/* ---------- hojas ---------- */
let lastFocus = null;
function openSheet(html, label) { lastFocus = document.activeElement; $('#sheet').innerHTML = html; $('#sheet').setAttribute('aria-label', label || ''); $('#ov').hidden = false; document.body.classList.add('lock'); $('#sheet').scrollTop = 0; const f = $('#sheet').querySelector('input,button'); if (f) f.focus({ preventScroll: true }); }
function closeSheet() { $('#ov').hidden = true; document.body.classList.remove('lock'); openDay = null; ED = null; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
function openDaySheet(k) { openDay = k; openSheet('', 'Corregir día'); fillDay(); }
function fillDay() {
  const k = openDay, d = parse(k), i = dayInfo(k);
  $('#sheet').innerHTML = `<div class="bloque-h"><h2>${DFULL[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}</h2><button class="icon-btn" data-act="closeSheet" aria-label="Cerrar">${ic('x')}</button></div>` +
    (i.due ? `<ul class="lista">${i.list.map(h => `<li class="dayrow item ${isDone(h, k) ? 'done' : ''}" style="--c:${colorDe(h)}"><span class="emo-i" aria-hidden="true">${esc(h.emoji)}</span><div class="txt"><span class="nm">${esc(h.name)}</span></div>
      <button class="chk" data-act="dtick" data-id="${h.id}" aria-pressed="${isDone(h, k)}" aria-label="${isDone(h, k) ? 'Desmarcar' : 'Marcar'} ${esc(h.name)}">${TILDE}</button></li>`).join('')}</ul>` : '<p class="vacio">No tenías nada programado este día.</p>');
}
function editHabit(id) {
  const h = id ? S.habits.find(x => x.id === id) : { name: '', emoji: '💪', color: COLORS[2].c, days: [1,2,3,4,5], time: '', times: {}, since: todayKey(), routine: null };
  const cur = colorDe(h);
  ED = { id, color: cur };
  const per = Object.keys(h.times).length > 0;
  openSheet(`<div class="bloque-h"><h2>${id ? 'Editar hábito' : 'Nuevo hábito'}</h2><button class="icon-btn" data-act="closeSheet" aria-label="Cerrar">${ic('x')}</button></div>
    <label class="lb" for="e-name">Nombre</label>
    <div class="er"><input type="text" class="emo" id="e-emoji" maxlength="8" value="${esc(h.emoji)}" aria-label="Emoji del hábito"><input type="text" id="e-name" placeholder="Nombre del hábito" value="${esc(h.name)}"></div>
    <div class="quick" role="group" aria-label="Emojis rápidos">${QUICK.map(e => `<button type="button" data-act="emo" data-e="${e}" aria-label="Usar ${e}">${e}</button>`).join('')}</div>
    <span class="lb" id="lb-dias">Días</span><div class="chips" id="e-days" role="group" aria-labelledby="lb-dias">${ORDER.map(d => `<button type="button" class="dchip ${h.days.includes(d) ? 'on' : ''}" data-act="dchip" data-d="${d}" aria-pressed="${h.days.includes(d)}" aria-label="${DFULL[d]}">${DAYS[d]}</button>`).join('')}</div>
    <label class="lb" for="e-time">Horario (opcional)</label>
    <div id="e-main"><input type="time" id="e-time" value="${esc(h.time)}"></div>
    <label class="per"><input type="checkbox" id="e-per" data-act="per" ${per ? 'checked' : ''}> Horario distinto según el día</label>
    <div id="e-times">${ORDER.map(d => `<div class="trow" data-d="${d}"><span>${DAYS[d]}</span><input type="time" aria-label="Horario del ${DFULL[d]}" value="${esc(h.times[d] || h.time || '')}"></div>`).join('')}</div>
    <span class="lb" id="lb-color">Color</span><div class="sw" id="e-col" role="radiogroup" aria-labelledby="lb-color">${COLORS.map(c => `<button type="button" role="radio" aria-checked="${c.c === cur}" class="${c.c === cur ? 'on' : ''}" style="background:${c.c}" data-act="col" data-c="${c.c}" aria-label="Color ${c.n}"></button>`).join('')}</div>
    <label class="lb" for="e-routine">Rutina</label><select id="e-routine"><option value="">Ninguna</option>${S.routines.map(r => `<option value="${r.id}" ${r.id === h.routine ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select>
    <label class="lb" for="e-since">Empieza el</label><input type="date" id="e-since" value="${h.since}">
    <label class="lb" for="e-hito">Hito propio (opcional)</label><input type="number" id="e-hito" min="1" max="9999" inputmode="numeric" placeholder="Ej: 10 sesiones" value="${h.hito > 0 ? h.hito : ''}">
    <div class="form-pie"><button class="b-sec" data-act="closeSheet">Cancelar</button><button class="b-pri" data-act="saveH">Guardar</button></div>
    ${id ? `<div class="zona-borrar"><button class="b-txt neg" data-act="delH">${ic('trash-2', 's')}Borrar hábito</button></div>` : ''}`, id ? 'Editar hábito' : 'Nuevo hábito');
  refreshTimes();
}
function refreshTimes() {
  const per = $('#e-per').checked;
  $('#e-main').hidden = per;
  const on = $$('#e-days .on').map(b => +b.dataset.d);
  $$('.trow').forEach(r => r.hidden = !per || !on.includes(+r.dataset.d));
}
function saveHabit() {
  const name = $('#e-name').value.trim(), days = $$('#e-days .on').map(b => +b.dataset.d);
  if (!name) return toast('Ponele un nombre.');
  if (!days.length) return toast('Elegí al menos un día.');
  const per = $('#e-per').checked, times = {};
  if (per) $$('.trow').forEach(r => { const d = +r.dataset.d, v = r.querySelector('input').value; if (days.includes(d) && v) times[d] = v; });
  const hito = Math.round(+$('#e-hito').value) || 0;
  const o = { name, emoji: $('#e-emoji').value.trim() || '⭐', color: ED.color, days, time: per ? '' : $('#e-time').value, times,
    since: $('#e-since').value || todayKey(), routine: $('#e-routine').value || null };
  if (hito > 0) o.hito = hito;
  if (ED.id) { const h = S.habits.find(h => h.id === ED.id); Object.assign(h, o); if (!(hito > 0)) delete h.hito; }
  else S.habits.push({ id: uid(), ...o });
  save(); closeSheet(); render(); toast('Guardado.');
}
function editRoutine(id) {
  const r = id ? S.routines.find(x => x.id === id) : { name: '' };
  ED = { id };
  openSheet(`<div class="bloque-h"><h2>${id ? 'Editar rutina' : 'Nueva rutina'}</h2><button class="icon-btn" data-act="closeSheet" aria-label="Cerrar">${ic('x')}</button></div>
    <label class="lb" for="r-name">Nombre</label><input type="text" id="r-name" placeholder="Ej: Mañana, Noche" value="${esc(r.name)}">
    <p class="mu t14">Después asignale hábitos desde la edición de cada hábito.</p>
    <div class="form-pie"><button class="b-sec" data-act="closeSheet">Cancelar</button><button class="b-pri" data-act="saveR">Guardar</button></div>
    ${id ? `<div class="zona-borrar"><button class="b-txt neg" data-act="delR">${ic('trash-2', 's')}Borrar rutina</button></div>` : ''}`, id ? 'Editar rutina' : 'Nueva rutina');
}

/* ---------- respaldo ---------- */
async function exportData() {
  const txt = JSON.stringify(S, null, 2), name = `habitos-${todayKey()}.json`;
  const file = new File([txt], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
$('#imp').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!s || !Array.isArray(s.habits)) throw 0;
    if (!confirm('Esto reemplaza todo lo que tenés ahora. ¿Seguro?')) return;
    S = normalize(s); save(); render(); toast('Datos importados.');
  } catch (err) { toast('Ese archivo no sirve.'); }
});

/* ---------- navegación por hash (#hoy, #prog, #hab) ---------- */
function leerHash() { const t = location.hash.replace('#', '').split('-')[0]; return ['hoy', 'prog', 'hab'].includes(t) ? t : 'hoy'; }
function irTab(t, ancla) {
  V.tab = t;
  const h = ancla ? t + '-' + ancla : t;
  if (location.hash.replace('#', '') !== h) history.replaceState(null, '', '#' + h);
  render();
  if (ancla) { const el = document.getElementById(ancla); if (el) el.scrollIntoView({ block: 'start' }); } else window.scrollTo(0, 0);
}
addEventListener('hashchange', () => { const t = leerHash(); if (t !== V.tab) irTab(t); });

/* ---------- eventos ---------- */
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#ov').hidden) closeSheet(); });
document.addEventListener('click', e => {
  if (e.target.id === 'ov') return closeSheet();
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, d = t.dataset;
  switch (a) {
    case 'tab': e.preventDefault(); irTab(d.t, d.ancla); break;
    case 'tick': toggle(d.id, todayKey()); break;
    case 'dtick': toggle(d.id, openDay, true); break;
    case 'day': openDaySheet(d.k); break;
    case 'wk': V.week += +d.n; render(); break;
    case 'mo': V.month += +d.n; render(); break;
    case 'editH': editHabit(d.id); break;
    case 'editR': editRoutine(d.id); break;
    case 'closeSheet': closeSheet(); break;
    case 'cerrarSello': $('#sello-slot').innerHTML = ''; break;
    case 'privado': Comun.setPrivado(!Comun.privado()); render(); break;
    case 'emo': $('#e-emoji').value = d.e; break;
    case 'dchip': t.classList.toggle('on'); t.setAttribute('aria-pressed', t.classList.contains('on')); refreshTimes(); break;
    case 'per': refreshTimes(); break;
    case 'col': ED.color = d.c; $$('#e-col button').forEach(b => { b.classList.toggle('on', b === t); b.setAttribute('aria-checked', b === t); }); break;
    case 'saveH': saveHabit(); break;
    case 'delH': {
      const h = S.habits.find(x => x.id === ED.id);
      if (confirm(`¿Borrar "${h.name}"? Se pierde también su historial.`)) {
        S.habits = S.habits.filter(x => x !== h);
        for (const k in S.log) { S.log[k] = S.log[k].filter(i => i !== h.id); if (!S.log[k].length) delete S.log[k]; }
        save(); closeSheet(); render(); toast('Hábito borrado.');
      }
      break;
    }
    case 'saveR': {
      const name = $('#r-name').value.trim();
      if (!name) return toast('Ponele un nombre.');
      if (ED.id) S.routines.find(r => r.id === ED.id).name = name; else S.routines.push({ id: uid(), name });
      save(); closeSheet(); render(); break;
    }
    case 'delR':
      if (confirm('¿Borrar la rutina? Los hábitos quedan, solo se desagrupan.')) {
        S.habits.forEach(h => { if (h.routine === ED.id) h.routine = null; });
        S.routines = S.routines.filter(r => r.id !== ED.id);
        save(); closeSheet(); render();
      }
      break;
    case 'goal': S.settings.goal = Math.max(1, Math.min(10, S.settings.goal + +d.n)); save(); render(); break;
    case 'wmin': S.settings.weekMin = Math.max(1, Math.min(7, weekMin() + +d.n)); save(); render(); break;
    case 'sound': S.settings.sound = !S.settings.sound; save(); render(); if (S.settings.sound) click(); break;
    case 'syncLogin': {
      t.disabled = true;
      Sync.login($('#sy-mail').value.trim(), $('#sy-pass').value).then(r => { t.disabled = false; if (r.error) { const e = $('#sy-err'); if (e) e.textContent = r.error; } });
      break;
    }
    case 'syncNow': Sync.retry(); break;
    case 'syncOut': if (confirm('¿Salir? Tus datos quedan en este dispositivo y en la nube.')) Sync.logout(); break;
    case 'export': exportData(); break;
    case 'import': $('#imp').click(); break;
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S = load(); render(); } });
addEventListener('pageshow', e => { if (e.persisted) { S = load(); render(); } });

V.tab = leerHash();
render();
if (location.hash.includes('-')) irTab(V.tab, location.hash.split('-').slice(1).join('-'));
if (window.Sync) { Sync.onStatus(renderSync); Sync.register('habitos', () => { S = load(); render(); }); }
</script>
</body>
