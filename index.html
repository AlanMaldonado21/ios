<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hábitos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<meta name="theme-color" content="#58cc02">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#2f3a40;--mu:#66757e;--ln:#e6ebef;--g:#58cc02;--gd:#46a302;--red:#ffd9db;--redtx:#e5484d;--na:#e9edf0;--amb:#ffe9b0;--ambtx:#a87400;--sh:rgba(0,0,0,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#10191e;--card:#1b2830;--tx:#eaf1f4;--mu:#8ea2ad;--ln:#2b3b45;--red:#4b2930;--redtx:#ff7b80;--na:#24323a;--amb:#4b4020;--ambtx:#ffc94d;--sh:rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom));touch-action:manipulation;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:28px;margin:4px 0 2px}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:13px;margin:0 0 10px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.sub{margin:0 0 16px;color:var(--mu);font-weight:600}.sub::first-letter{text-transform:uppercase}
main{max-width:560px;margin:0 auto;padding:16px}

/* header */
.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#6fd62a,#3f9e00);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;box-shadow:0 2px 14px var(--sh)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.flame{display:flex;align-items:center;gap:8px}
.fl{font-size:46px;line-height:1;display:inline-block;filter:grayscale(1) brightness(1.5) opacity(.55)}
.lit .fl{filter:none;animation:flick 1.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}}
.flame b{font-size:36px;line-height:1;display:block}
.flame small{display:block;font-size:12px;font-weight:700;opacity:.92}
.lvl{flex:1;max-width:190px;text-align:right}
.lvl b{font-size:15px}
.lvl small{display:block;font-size:12px;font-weight:700;opacity:.92;margin-top:3px}
.bar{height:12px;border-radius:7px;background:rgba(255,255,255,.35);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:#fff;border-radius:7px;transition:width .6s}
.bar.dk{background:var(--na)}
.bar.dk i{background:var(--g)}

/* cards */
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05)}
.grp{display:flex;justify-content:space-between;align-items:center;margin:18px 4px 8px;font-weight:800;color:var(--mu);text-transform:uppercase;font-size:13px;letter-spacing:.06em}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05);transition:background .3s,border-color .3s}
.item.done{border-color:color-mix(in srgb,var(--g) 55%,transparent);background:color-mix(in srgb,var(--g) 10%,var(--card))}
.item.done .nm{text-decoration:line-through;opacity:.55}
.ico{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:26px;flex:none}
.txt{flex:1;min-width:0}
.nm{display:block;font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis}
.meta{display:block;color:var(--mu);font-size:13px;font-weight:600;margin-top:2px}
.chk{width:60px;height:60px;border-radius:50%;flex:none;border:3px solid var(--c);background:transparent;color:transparent;font-size:30px;font-weight:900;display:grid;place-items:center;padding:0;transition:background .2s,color .2s}
.chk:active{transform:scale(.92)}
.done .chk{background:var(--c);color:#fff;box-shadow:0 8px 18px -6px var(--c)}
.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.empty{text-align:center;padding:36px 12px;color:var(--mu);font-weight:600}
.empty .big{font-size:64px;display:block;margin-bottom:8px}

/* buttons */
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:15px;color:#fff;background:var(--g);box-shadow:0 8px 18px -8px var(--g);margin-bottom:8px}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--ln);box-shadow:none}
.btn.dng{background:#ff4b4b;box-shadow:0 8px 18px -8px #ff4b4b}
.btn.row2{display:inline-block;width:calc(50% - 4px)}
.rowb{display:flex;gap:8px}
.rowb .btn{flex:1}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper button{width:48px;height:48px;border-radius:14px;border:1px solid var(--ln);background:var(--card);font-size:24px;font-weight:900}
.stepper b{font-size:22px}

/* progreso */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--ln);box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05);border-radius:22px;padding:12px;text-align:center}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat span{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav button{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--card);font-size:20px;font-weight:900}
.nav div{text-align:center;font-weight:800}
.nav small{display:block;color:var(--mu);font-weight:700}
.wk{display:grid;grid-template-columns:34px repeat(7,1fr);gap:5px;align-items:center;margin-bottom:5px}
.wk .dh{text-align:center;font-size:11px;font-weight:800;color:var(--mu);line-height:1.2}
.wk .dh.today{color:#1cb0f6}
.wk .le{font-size:22px;text-align:center}
.c{aspect-ratio:1;max-height:42px;width:100%;border-radius:11px;display:grid;place-items:center;font-weight:900;border:2px solid transparent;font-size:15px}
.s-ok{background:var(--g);color:#fff}
.s-miss{background:var(--red);color:var(--redtx)}
.s-part{background:var(--amb);color:var(--ambtx)}
.s-na{background:var(--na);color:var(--mu)}
.s-pend{border:2px dashed var(--g);color:var(--g)}
.s-fut{border:2px solid var(--ln);color:var(--mu)}
.is-today{box-shadow:0 0 0 3px #1cb0f6}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{text-align:center;font-size:11px;font-weight:800;color:var(--mu)}
button.c{padding:0;font:inherit;font-weight:900}
button.c:disabled{opacity:.6}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;font-weight:700;color:var(--mu)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.hs{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}
.hs:first-of-type{border-top:0}
.hs .ico{width:40px;height:40px;font-size:21px}

/* hábitos */
.hc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05);border-radius:22px;padding:12px;margin-bottom:10px}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{font-style:normal;font-size:10px;font-weight:800;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--na);color:var(--mu)}
.dots i.on{background:var(--c);color:#fff}
.tog{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:12px}

/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:26px 26px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60%);opacity:0}}
.sheet label,.lb{display:block;font-size:13px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
.sheet input[type=text],.sheet input[type=time],.sheet input[type=date],.sheet select{width:100%;padding:12px;border-radius:14px;border:2px solid var(--ln);background:var(--card);font-size:16px;min-height:48px}
.sheet input[type=time],.sheet input[type=date]{-webkit-appearance:none;appearance:none}
.er{display:flex;gap:8px}
.emo{width:72px!important;text-align:center;font-size:28px!important;flex:none}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{width:40px;height:40px;border-radius:12px;border:2px solid var(--ln);background:var(--card);font-size:20px;padding:0}
.chips{display:flex;gap:6px}
.dchip{flex:1;padding:12px 0;border-radius:12px;border:2px solid var(--ln);background:var(--card);font-weight:800;font-size:13px}
.dchip.on{background:#1cb0f6;border-color:#1cb0f6;color:#fff}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid transparent;padding:0}
.sw button.on{border-color:var(--tx);box-shadow:0 0 0 2px var(--bg) inset}
.trow{display:flex;align-items:center;gap:10px;margin-top:6px}
.trow span{width:40px;font-weight:800}
.sheet label.per{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:700;font-size:15px;text-transform:none;letter-spacing:0;color:var(--tx)!important}
.per input{width:22px;height:22px}
.dayrow{display:flex;align-items:center;gap:12px;padding:10px 0}
.dayrow .chk{width:54px;height:54px;font-size:28px}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs-in{display:flex;gap:4px;width:100%;max-width:560px}
.tabs button{flex:1;min-height:54px;border:0;border-radius:14px;background:none;padding:7px 0 5px;font-size:10.5px;font-weight:800;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:21px;line-height:1.1}
.tabs button.on{background:color-mix(in srgb,#1cb0f6 13%,transparent);color:#1cb0f6}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.cf{position:absolute;width:9px;height:14px;border-radius:2px}
.xp{position:absolute;font-weight:900;font-size:20px;color:var(--g);text-shadow:0 2px 0 rgba(0,0,0,.15)}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#2f3a40;color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;z-index:95;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.cele{position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,#6fd62a,#2f8f00);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.cele .big{font-size:96px;animation:pop .8s cubic-bezier(.3,1.6,.5,1)}
.cele h1{font-size:34px;margin:10px 0}
.cele p{font-size:18px;font-weight:700;margin:4px 0}
.cele .btn{background:#fff;color:#3f9e00;box-shadow:0 4px 0 #cfe9bd;max-width:320px;margin-top:28px}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="view"></main>
<nav class="tabs"><div class="tabs-in">
  <button data-act="tab" data-t="hoy"><span>☀️</span>Hoy</button>
  <button data-act="tab" data-t="prog"><span>📈</span>Progreso</button>
  <button data-act="tab" data-t="hab"><span>🎯</span>Hábitos</button>
  <button onclick="location.href='finanzas/'"><span>💰</span>Finanzas</button>
</div></nav>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>
<div class="cele" id="cele" hidden></div>
<div id="fx"></div>
<div id="toast"></div>
<input type="file" id="imp" accept="application/json,.json,text/plain" hidden>

<script src="config.js"></script>
<script src="sync.js"></script>
<script>
'use strict';
const LS = 'habitos-v1';
const XP = 10, BONUS = 20;
const DAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DL = ['D','L','M','M','J','V','S'];
const DFULL = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ORDER = [1,2,3,4,5,6,0];
const COLORS = ['#ff4b4b','#ff9600','#ffc800','#58cc02','#1cb0f6','#2b70c9','#ce82ff','#ff86d0'];
const QUICK = ['💻','📐','🏋️','🏃','📚','🧘','💧','🥗','😴','🎸','✍️','🧹'];
const FRASES = ['¡Sos una máquina!','¡Lo hiciste, crack!','Otro día para la bolsa.','Así se hace. Constancia pura.','Día cerrado. Mañana otra vez.'];

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayKey = () => key(new Date());
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- datos ---------- */
function seed() {
  const t = todayKey();
  const h = (name, emoji, color, days, time, times) => ({ id: uid(), name, emoji, color, days, time: time || '', times: times || {}, since: t, routine: null });
  return normalize({
    habits: [
      h('Desarrollo (Mieza / Tablero 360)', '💻', COLORS[4], [1,2,3,4,5], '07:00'),
      h('Matemática V', '📐', COLORS[6], [1,2,3,4,5], '', {1:'08:00',3:'08:00',2:'20:00',4:'20:00',5:'20:00'}),
      h('Gym', '🏋️', COLORS[1], [1,3,5], '19:00'),
      h('5k', '🏃', COLORS[3], [0], '')
    ]
  });
}
function normalize(s) {
  s.habits = Array.isArray(s.habits) ? s.habits : [];
  s.routines = Array.isArray(s.routines) ? s.routines : [];
  s.log = s.log && typeof s.log === 'object' ? s.log : {};
  s.settings = Object.assign({ goal: 2, sound: true }, s.settings);
  s.habits.forEach(h => { h.days = h.days || []; h.times = h.times || {}; h.time = h.time || ''; h.since = h.since || todayKey(); h.routine = h.routine || null; });
  return s;
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(LS)); if (s && Array.isArray(s.habits)) return normalize(s); } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} if (window.Sync) Sync.touch('habitos'); }
let S = load(); save();
const V = { tab: 'hoy', week: 0, month: 0 };
let openDay = null, ED = null;

/* ---------- lógica ---------- */
const timeFor = (h, dow) => (h.times && h.times[dow]) || h.time || '';
const due = (h, k) => k >= h.since && h.days.includes(parse(k).getDay());
const isDone = (h, k) => (S.log[k] || []).includes(h.id);
function dayInfo(k) {
  const list = S.habits.filter(h => due(h, k));
  return { list, due: list.length, done: list.filter(h => isDone(h, k)).length };
}
const met = i => i.due > 0 && i.done >= Math.min(S.settings.goal, i.due);
const complete = i => i.due > 0 && i.done === i.due;
const dayXP = k => { const i = dayInfo(k); return i.done * XP + (complete(i) ? BONUS : 0); };
function totalXP() { let x = 0; for (const k in S.log) x += dayXP(k); return x; }
const TITLES = ['Arrancando','Aprendiz','Constante','Disciplinado','Imparable','Máquina','Crack','Fiera','Leyenda','Mito'];
const titleOf = l => TITLES[Math.min(l, TITLES.length) - 1];
const need = l => 50 * l * (l - 1);
function levelOf(xp) { let l = 1; while (xp >= need(l + 1)) l++; return l; }

function habitStreak(h) {
  const today = todayKey();
  let run = 0, best = 0;
  for (let d = parse(h.since); key(d) <= today; d = addDays(d, 1)) {
    const k = key(d);
    if (!due(h, k)) continue;
    if (isDone(h, k)) { run++; if (run > best) best = run; }
    else if (k !== today) run = 0;
  }
  return { cur: run, best };
}
/* Día de gracia: un día fallado no corta la racha si venías con racha y no usaste otro en los últimos 7 días. */
function globalStreak() {
  const today = todayKey();
  if (!S.habits.length) return { cur: 0, best: 0, lit: false, grace: null };
  const start = S.habits.reduce((m, h) => h.since < m ? h.since : m, today);
  let run = 0, best = 0, grace = null;
  for (let d = parse(start); key(d) <= today; d = addDays(d, 1)) {
    const k = key(d), i = dayInfo(k);
    if (!i.due) continue;
    if (met(i)) { run++; if (run > best) best = run; }
    else if (k !== today) {
      if (run > 0 && (!grace || (parse(k) - parse(grace)) / 864e5 >= 7)) grace = k;
      else run = 0;
    }
  }
  const ti = dayInfo(today);
  return { cur: run, best, lit: ti.due ? met(ti) : run > 0, grace: grace && (parse(today) - parse(grace)) / 864e5 < 7 ? grace : null };
}
function pct(from, to) {
  const today = todayKey();
  let n = 0, dn = 0;
  for (let d = from; d <= to; d = addDays(d, 1)) {
    const k = key(d);
    if (k > today) break;
    // El día en curso no cuenta como fallado: suma solo lo que ya hiciste, lo pendiente no baja el %.
    const i = dayInfo(k); n += k === today ? i.done : i.due; dn += i.done;
  }
  return n ? Math.round(dn / n * 100) : null;
}
const weekStart = off => { const t = new Date(); t.setHours(0,0,0,0); return addDays(t, -((t.getDay() + 6) % 7) + off * 7); };
const monthRef = off => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth() + off, 1); };
function habitState(h, k) {
  if (!due(h, k)) return 'na';
  if (isDone(h, k)) return 'ok';
  const t = todayKey();
  return k > t ? 'fut' : k === t ? 'pend' : 'miss';
}
function dayState(k) {
  const i = dayInfo(k), t = todayKey();
  if (!i.due) return 'na';
  if (i.done === i.due) return 'ok';
  if (k > t) return 'fut';
  if (k === t) return i.done ? 'part' : 'pend';
  return i.done ? 'part' : 'miss';
}

/* ---------- vistas ---------- */
function header() {
  const g = globalStreak(), xp = totalXP(), lv = levelOf(xp);
  const p = (xp - need(lv)) / (need(lv + 1) - need(lv)) * 100;
  return `<div class="top-in">
    <div class="flame ${g.lit ? 'lit' : ''}"><span class="fl">🔥</span><div><b>${g.cur}</b><small>${g.cur === 1 ? 'día' : 'días'} de racha${g.grace ? ' · gracia usada' : ''}</small></div></div>
    <div class="lvl"><b>${titleOf(lv)}</b><div class="bar"><i style="width:${p}%"></i></div><small>Nivel ${lv} · ${xp - need(lv)} / ${need(lv + 1) - need(lv)} XP</small></div>
  </div>`;
}
const byTime = dow => (a, b) => (timeFor(a, dow) || '99').localeCompare(timeFor(b, dow) || '99') || a.name.localeCompare(b.name);
function metaLine(h, dow) {

function toggle(hid, k, fromSheet) {

  const arr = S.log[k] || (S.log[k] = []);
  const ix = arr.indexOf(hid), on = ix < 0;
  if (on) arr.push(hid); else arr.splice(ix, 1);
  if (!arr.length) delete S.log[k];
  save();
  render();
  if (!on) return;
  const iAfter = dayInfo(k), lvAfter = levelOf(totalXP());
  chime([660, 880]);
  if (navigator.vibrate) navigator.vibrate(30);
  if (!fromSheet) {
    const el = $(`.item[data-id="${hid}"] .chk`);
    if (el) {
      el.classList.add('pop');
      const r = el.getBoundingClientRect(), h = S.habits.find(x => x.id === hid);
      burst(r.left + r.width / 2, r.top + r.height / 2, 26, 1, [h.color, '#fff', '#ffc800']);
      floatXP(r.left + r.width / 2 - 30, r.top - 10, '+' + XP + ' XP');
    }
  }
  const lvUp = lvAfter > lvBefore;
  if (k === todayKey() && complete(iAfter) && !wasComplete && !fromSheet) setTimeout(() => celebrate(lvUp ? lvAfter : 0), 650);
  else if (lvUp) toast(`⬆️ ¡Nivel ${lvAfter}! Ahora sos ${titleOf(lvAfter)}`);
  else if (met(iAfter) && !wasMet) toast('🎯 ¡Meta diaria cumplida!');

function celebrate(newLevel) {

function burst(x, y, n, spread, cols) {
  const fx = $('#fx'), all = cols || COLORS;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i'); p.className = 'cf';
    p.style.cssText = `left:${x}px;top:${y}px;background:${all[i % all.length]}`;
    fx.appendChild(p);
    const a = Math.random() * Math.PI * 2, v = (50 + Math.random() * 110) * spread;
    const dx = Math.cos(a) * v, dy = Math.sin(a) * v - 60;
    p.animate([
      { transform: 'translate(0,0) rotate(0)', opacity: 1 },
      { transform: `translate(${dx}px,${dy}px) rotate(${Math.random() * 360}deg)`, opacity: 1, offset: .4 },
      { transform: `translate(${dx * 1.2}px,${dy + 180}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }

  }
}

    p.style.cssText = `left:${Math.random() * 100}%;top:-20px;background:${COLORS[i % COLORS.length]}`;
    fx.appendChild(p);

  openSheet(`<h2>${id ? 'Editar rutina' : 'Nueva rutina'}</h2>
    <input type="text" id="r-name" placeholder="Ej: Mañana, Noche" value="${esc(r.name)}">
    <p style="color:var(--mu);font-size:13px;font-weight:600">Después asignale hábitos desde la edición de cada hábito.</p>
    <button class="btn" data-act="saveR">Guardar</button>${id ? '<button class="btn dng" data-act="delR">Borrar rutina</button>' : ''}<button class="btn sec" data-act="closeSheet">Cancelar</button>`);
}

/* ---------- respaldo ---------- */
async function exportData() {
  const txt = JSON.stringify(S, null, 2), name = `habitos-${todayKey()}.json`;
  const file = new File([txt], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
$('#imp').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!s || !Array.isArray(s.habits)) throw 0;
    if (!confirm('Esto reemplaza todo lo que tenés ahora. ¿Seguro?')) return;
    S = normalize(s); save(); render(); toast('✅ Datos importados');
  } catch (err) { toast('❌ Ese archivo no sirve'); }
});

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'ov') return closeSheet();
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, d = t.dataset;
  switch (a) {
    case 'tab': V.tab = d.t; window.scrollTo(0, 0); render(); break;
    case 'tick': toggle(d.id, todayKey()); break;
    case 'dtick': toggle(d.id, openDay, true); break;
    case 'day': openDaySheet(d.k); break;
    case 'wk': V.week += +d.n; render(); break;
    case 'mo': V.month += +d.n; render(); break;
    case 'editH': editHabit(d.id); break;
    case 'editR': editRoutine(d.id); break;
    case 'closeSheet': closeSheet(); break;
    case 'closeCele': $('#cele').hidden = true; break;
    case 'emo': $('#e-emoji').value = d.e; break;
    case 'dchip': t.classList.toggle('on'); refreshTimes(); break;
    case 'per': refreshTimes(); break;
    case 'col': ED.color = d.c; $$('#e-col button').forEach(b => b.classList.toggle('on', b === t)); break;
    case 'saveH': saveHabit(); break;
    case 'delH': {
      const h = S.habits.find(x => x.id === ED.id);
      if (confirm(`¿Borrar "${h.name}"? Se pierde también su historial.`)) {
        S.habits = S.habits.filter(x => x !== h);
        for (const k in S.log) { S.log[k] = S.log[k].filter(i => i !== h.id); if (!S.log[k].length) delete S.log[k]; }
        save(); closeSheet(); render();
      }
      break;
    }
    case 'saveR': {
      const name = $('#r-name').value.trim();
      if (!name) return toast('Ponele un nombre');
      if (ED.id) S.routines.find(r => r.id === ED.id).name = name; else S.routines.push({ id: uid(), name });
      save(); closeSheet(); render(); break;
    }
    case 'delR':
      if (confirm('¿Borrar la rutina? Los hábitos quedan, solo se desagrupan.')) {
        S.habits.forEach(h => { if (h.routine === ED.id) h.routine = null; });
        S.routines = S.routines.filter(r => r.id !== ED.id);
        save(); closeSheet(); render();
      }
      break;
    case 'goal': S.settings.goal = Math.max(1, Math.min(10, S.settings.goal + +d.n)); save(); render(); break;
    case 'sound': S.settings.sound = !S.settings.sound; save(); render(); if (S.settings.sound) chime([660, 880]); break;
    case 'syncLogin': {
      t.disabled = true;
      Sync.login($('#sy-mail').value.trim(), $('#sy-pass').value).then(r => { t.disabled = false; if (r.error) { const e = $('#sy-err'); if (e) e.textContent = r.error; } });
      break;
    }
    case 'syncNow': Sync.retry(); break;
    case 'syncOut': if (confirm('¿Salir? Tus datos quedan en este dispositivo y en la nube.')) Sync.logout(); break;
    case 'export': exportData(); break;
    case 'import': $('#imp').click(); break;
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S = load(); render(); } });
addEventListener('pageshow', e => { if (e.persisted) { S = load(); render(); } });

render();
if (window.Sync) { Sync.onStatus(renderSync); Sync.register('habitos', () => { S = load(); render(); }); }
</script>
</body>
</html>
